<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerador de QR Codes | Galáxia Navegação</title>


    <!-- Biblioteca para gerar QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Biblioteca para criar ZIP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            padding: 30px 15px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f2f5f8;

            color: #222;
        }


        /* =====================================================
           CONTAINER
        ===================================================== */

        .container {
            width: 100%;

            max-width: 1100px;

            margin: auto;
        }


        /* =====================================================
           CABEÇALHO
        ===================================================== */

        .topo {
            background: #ffffff;

            border-bottom: 5px solid #f2c300;

            border-radius: 16px;

            padding: 25px 20px;

            text-align: center;

            margin-bottom: 25px;

            box-shadow:
                0 3px 15px rgba(0,0,0,0.08);
        }


        .logo {
            max-width: 250px;

            width: 75%;

            height: auto;

            display: block;

            margin: 0 auto 15px;
        }


        .titulo {
            margin: 0;

            color: #174a8b;

            font-size: 24px;
        }


        .subtitulo {
            margin: 7px 0 0;

            color: #777;

            font-size: 14px;
        }


        /* =====================================================
           CONTROLES
        ===================================================== */

        .controles {
            background: #ffffff;

            border-radius: 14px;

            padding: 20px;

            margin-bottom: 25px;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.07);

            text-align: center;
        }


        .informacao {
            color: #666;

            margin-bottom: 15px;

            font-size: 14px;
        }


        .quantidade {
            color: #174a8b;

            font-size: 20px;

            font-weight: bold;
        }


        .botoes {
            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 10px;
        }


        button {
            border: none;

            border-radius: 8px;

            padding: 12px 18px;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .botao-gerar {
            background: #174a8b;

            color: white;
        }


        .botao-gerar:hover {
            background: #123b70;

            transform: translateY(-1px);
        }


        .botao-zip {
            background: #f2c300;

            color: #17324d;
        }


        .botao-zip:hover {
            background: #dcb000;

            transform: translateY(-1px);
        }


        button:disabled {
            opacity: 0.5;

            cursor: not-allowed;

            transform: none;
        }


        /* =====================================================
           STATUS
        ===================================================== */

        #status {
            margin-top: 15px;

            color: #666;

            font-size: 13px;
        }


        /* =====================================================
           GRID
        ===================================================== */

        .grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(230px, 1fr)
                );

            gap: 18px;
        }


        /* =====================================================
           CARD QR CODE
        ===================================================== */

        .qr-card {
            background: #ffffff;

            border-radius: 14px;

            padding: 20px;

            text-align: center;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.07);

            border: 1px solid #e1e5e9;

            transition: 0.2s;
        }


        .qr-card:hover {
            transform: translateY(-2px);

            box-shadow:
                0 7px 18px rgba(0,0,0,0.10);
        }


        .qr-container {
            width: 210px;

            height: 210px;

            margin: 0 auto 15px;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        .qr-container img {
            width: 210px;

            height: 210px;
        }


        .nome {
            color: #174a8b;

            font-size: 15px;

            font-weight: bold;

            line-height: 1.3;

            margin-bottom: 7px;
        }


        .matricula {
            color: #666;

            font-size: 13px;

            margin-bottom: 12px;
        }


        .botao-download {
            display: inline-block;

            background: #174a8b;

            color: white;

            text-decoration: none;

            padding: 9px 13px;

            border-radius: 6px;

            font-size: 12px;

            font-weight: bold;

            cursor: pointer;

            border: none;
        }


        .botao-download:hover {
            background: #123b70;
        }


        /* =====================================================
           CARREGANDO
        ===================================================== */

        .carregando {
            background: #ffffff;

            border-radius: 14px;

            padding: 40px;

            text-align: center;

            color: #666;
        }


        /* =====================================================
           ERRO
        ===================================================== */

        .erro {
            background: #ffffff;

            border-radius: 14px;

            padding: 40px 20px;

            text-align: center;

            color: #b00020;
        }


        /* =====================================================
           CELULAR
        ===================================================== */

        @media (max-width: 600px) {

            body {
                padding: 15px 10px;
            }


            .titulo {
                font-size: 20px;
            }


            .grid {
                grid-template-columns: 1fr;
            }


            .qr-container {
                width: 220px;

                height: 220px;
            }


            .qr-container img {
                width: 220px;

                height: 220px;
            }


            .botoes {
                display: block;
            }


            button {
                width: 100%;

                margin-bottom: 8px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =====================================================
         CABEÇALHO
    ===================================================== -->

    <header class="topo">


        <img
            class="logo"
            src="Logo%20-%20Fonte%20Azul.png"
            alt="Galáxia Navegação"
        >


        <h1 class="titulo">

            Gerador de QR Codes

        </h1>


        <p class="subtitulo">

            Consulta de certificados dos tripulantes

        </p>


    </header>



    <!-- =====================================================
         CONTROLES
    ===================================================== -->

    <section class="controles">


        <div class="informacao">

            Matrículas encontradas:

            <span
                id="quantidade"
                class="quantidade"
            >
                0
            </span>

        </div>


        <div class="botoes">


            <button
                id="botaoGerar"
                class="botao-gerar"
            >

                🔲 GERAR TODOS

            </button>


            <button
                id="botaoZip"
                class="botao-zip"
                disabled
            >

                📦 BAIXAR TODOS EM ZIP

            </button>


        </div>


        <div id="status">

            Carregando dados...

        </div>


    </section>



    <!-- =====================================================
         QR CODES
    ===================================================== -->

    <section
        id="qrCodes"
        class="grid"
    >

        <div class="carregando">

            Carregando matrículas...

        </div>

    </section>


</div>



<script>


    // =====================================================
    // CONFIGURAÇÃO
    // =====================================================


    const URL_SITE =
        "https://galaxia-qsms.github.io/certificados-tripulantes/";


    const qrCodes =
        document.getElementById("qrCodes");


    const quantidade =
        document.getElementById("quantidade");


    const status =
        document.getElementById("status");


    const botaoGerar =
        document.getElementById("botaoGerar");


    const botaoZip =
        document.getElementById("botaoZip");


    let dados =
        null;


    let matriculas =
        [];



    // =====================================================
    // 1. CARREGAR dados.json
    // =====================================================


    fetch(
        "dados.json",
        {
            cache: "no-cache"
        }
    )


    .then(resposta => {


        if (!resposta.ok) {

            throw new Error(
                "Não foi possível carregar o dados.json."
            );

        }


        return resposta.json();

    })


    .then(json => {


        dados =
            json;


        matriculas =
            Object.keys(dados);


        quantidade.textContent =
            matriculas.length;


        status.textContent =
            matriculas.length +
            " matrícula(s) encontrada(s).";


        qrCodes.innerHTML = "";


        botaoGerar.disabled =
            false;

    })


    .catch(erro => {


        console.error(erro);


        qrCodes.innerHTML = `

            <div class="erro">

                <h2>
                    Erro ao carregar os dados
                </h2>

                <p>
                    Verifique se o arquivo
                    <strong>dados.json</strong>
                    está no mesmo local deste arquivo.
                </p>

            </div>

        `;


        status.textContent =
            "Erro ao carregar dados.";

    });



    // =====================================================
    // 2. GERAR TODOS
    // =====================================================


    botaoGerar.addEventListener(
        "click",
        gerarTodos
    );



    function gerarTodos() {


        if (!dados) {

            alert(
                "Os dados ainda não foram carregados."
            );

            return;

        }


        qrCodes.innerHTML = "";


        status.textContent =
            "Gerando QR Codes...";


        botaoGerar.disabled =
            true;


        botaoZip.disabled =
            true;


        let contador =
            0;


        matriculas.forEach(
            matricula => {


                const funcionario =
                    dados[matricula];


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "qr-card";


                const qrContainer =
                    document.createElement(
                        "div"
                    );


                qrContainer.className =
                    "qr-container";


                qrContainer.id =
                    "qr-" + matricula;


                const nome =
                    document.createElement(
                        "div"
                    );


                nome.className =
                    "nome";


                nome.textContent =
                    funcionario.nome;


                const numero =
                    document.createElement(
                        "div"
                    );


                numero.className =
                    "matricula";


                numero.textContent =
                    "Matrícula: " +
                    matricula;


                const botao =
                    document.createElement(
                        "button"
                    );


                botao.className =
                    "botao-download";


                botao.textContent =
                    "⬇ Baixar QR Code";


                botao.addEventListener(
                    "click",
                    function () {

                        baixarQRCode(
                            matricula,
                            funcionario.nome
                        );

                    }
                );


                card.appendChild(
                    qrContainer
                );


                card.appendChild(
                    nome
                );


                card.appendChild(
                    numero
                );


                card.appendChild(
                    botao
                );


                qrCodes.appendChild(
                    card
                );


                // ---------------------------------------------
                // URL INDIVIDUAL
                // ---------------------------------------------

                const url =
                    URL_SITE +
                    "?matricula=" +
                    encodeURIComponent(
                        matricula
                    );


                // ---------------------------------------------
                // GERAR QR
                // ---------------------------------------------

                new QRCode(
                    qrContainer,
                    {

                        text: url,

                        width: 210,

                        height: 210,

                        correctLevel:
                            QRCode.CorrectLevel.H

                    }
                );


                contador++;


                status.textContent =
                    "Gerando " +
                    contador +
                    " de " +
                    matriculas.length +
                    "...";


            }
        );


        setTimeout(
            function () {


                status.textContent =
                    matriculas.length +
                    " QR Codes gerados com sucesso.";


                botaoGerar.disabled =
                    false;


                botaoZip.disabled =
                    false;


            },
            1000
        );

    }



    // =====================================================
    // 3. BAIXAR QR CODE INDIVIDUAL
    // =====================================================


    function baixarQRCode(
        matricula,
        nome
    ) {


        const container =
            document.getElementById(
                "qr-" + matricula
            );


        const imagem =
            container.querySelector(
                "img"
            );


        if (!imagem) {

            alert(
                "QR Code ainda não foi gerado."
            );

            return;

        }


        const link =
            document.createElement(
                "a"
            );


        link.href =
            imagem.src;


        link.download =
            "QR_" +
            matricula +
            "_" +
            nomeArquivo(nome) +
            ".png";


        document.body.appendChild(
            link
        );


        link.click();


        document.body.removeChild(
            link
        );

    }



    // =====================================================
    // 4. LIMPAR NOME PARA ARQUIVO
    // =====================================================


    function nomeArquivo(nome) {


        return nome

            .normalize("NFD")

            .replace(
                /[\u0300-\u036f]/g,
                ""
            )

            .replace(
                /[^a-zA-Z0-9]+/g,
                "_"
            )

            .replace(
                /^_+|_+$/g,
                ""
            );

    }



    // =====================================================
    // 5. BAIXAR TODOS EM ZIP
    // =====================================================


    botaoZip.addEventListener(
        "click",
        baixarTodosZIP
    );



    async function baixarTodosZIP() {


        if (
            !dados ||
            matriculas.length === 0
        ) {

            alert(
                "Nenhum QR Code disponível."
            );

            return;

        }


        const zip =
            new JSZip();


        status.textContent =
            "Preparando arquivo ZIP...";


        botaoZip.disabled =
            true;


        botaoGerar.disabled =
            true;


        let contador =
            0;


        for (
            const matricula of matriculas
        ) {


            const funcionario =
                dados[matricula];


            const container =
                document.getElementById(
                    "qr-" + matricula
                );


            if (!container) {

                continue;

            }


            const imagem =
                container.querySelector(
                    "img"
                );


            if (!imagem) {

                continue;

            }


            // ---------------------------------------------
            // Converter imagem para Blob
            // ---------------------------------------------

            const blob =
                await fetch(
                    imagem.src
                ).then(
                    resposta =>
                        resposta.blob()
                );


            // ---------------------------------------------
            // Adicionar ao ZIP
            // ---------------------------------------------

            const nome =
                nomeArquivo(
                    funcionario.nome
                );


            zip.file(
                "QR_" +
                matricula +
                "_" +
                nome +
                ".png",
                blob
            );


            contador++;


            status.textContent =
                "Adicionando " +
                contador +
                " de " +
                matriculas.length +
                " ao ZIP...";

        }


        // =================================================
        // GERAR ZIP
        // =================================================


        status.textContent =
            "Criando arquivo ZIP...";


        const arquivo =
            await zip.generateAsync(
                {
                    type: "blob"
                }
            );


        // =================================================
        // DOWNLOAD
        // =================================================


        const url =
            URL.createObjectURL(
                arquivo
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;


        link.download =
            "QR_Codes_Galaxia_Navegacao.zip";


        document.body.appendChild(
            link
        );


        link.click();


        document.body.removeChild(
            link
        );


        URL.revokeObjectURL(
            url
        );


        // =================================================
        // FINAL
        // =================================================


        status.textContent =
            contador +
            " QR Codes incluídos no ZIP.";


        botaoZip.disabled =
            false;


        botaoGerar.disabled =
            false;

    }


</script>


</body>

</html>
