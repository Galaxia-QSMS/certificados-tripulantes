<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Impressão de QR Codes | Galáxia Navegação</title>

    <!-- QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- FileSaver -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #f3f4f6;
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .topo {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }

        .topo h1 {
            margin: 0 0 8px 0;
            font-size: 25px;
        }

        .topo p {
            margin: 5px 0;
            color: #555;
        }

        .botoes {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 13px 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-gerar {
            background: #0066cc;
            color: white;
        }

        .btn-zip {
            background: #198754;
            color: white;
        }

        button:hover {
            opacity: .9;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
        }

        #artes {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
        }

        /*
        ==========================================================
        ARTE DE IMPRESSÃO
        10 cm x 15 cm
        300 DPI
        1181 x 1772 px
        ==========================================================
        */

        .arte {
            width: 1181px;
            height: 1772px;

            background: white;

            position: relative;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding-top: 55px;

            box-shadow: 0 3px 15px rgba(0,0,0,.15);

            overflow: hidden;
        }

        .identificacao {
            width: 1080px;
            height: 175px;

            text-align: center;

            display: flex;
            flex-direction: column;
            justify-content: center;

            margin-bottom: 25px;
        }

        .nome {
            font-size: 42px;
            font-weight: bold;

            line-height: 1.1;

            max-width: 1050px;

            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .matricula {
            font-size: 30px;
            margin-top: 15px;
            font-weight: bold;
        }

        /*
        GRID DOS 6 QR CODES
        */

        .grid-qr {

            width: 1062px;
            height: 1593px;

            display: grid;

            grid-template-columns: 531px 531px;
            grid-template-rows: 531px 531px 531px;

            gap: 0;

        }

        .qr-box {

            width: 531px;
            height: 531px;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        .qr {

            width: 531px;
            height: 531px;

        }

        /*
        OCULTA O CONTEÚDO DURANTE A TELA
        */

        #area-geracao {
            position: absolute;
            left: -99999px;
            top: 0;
        }

        /*
        PREVIEW
        */

        .preview-titulo {
            margin-top: 35px;
            margin-bottom: 15px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="topo">

        <h1>🖨️ Impressão de QR Codes</h1>

        <p>
            Gera automaticamente uma arte de <strong>10 × 15 cm</strong>
            com 6 QR Codes por tripulante.
        </p>

        <p>
            Cada QR Code possui aproximadamente <strong>4,5 × 4,5 cm</strong>.
        </p>

        <div id="contador">
            Carregando colaboradores...
        </div>

        <div class="botoes">

            <button
                class="btn-gerar"
                onclick="gerarTodasAsArtes()">
                🖨️ GERAR ARTES DE TODOS
            </button>

            <button
                class="btn-zip"
                onclick="baixarTodasEmZip()">
                📦 BAIXAR TODAS EM ZIP
            </button>

        </div>

        <div id="status"></div>

    </div>

</div>


<!--
==========================================================
ÁREA ONDE AS ARTES SÃO GERADAS
==========================================================
-->

<div id="area-geracao"></div>


<script>

    /*
    ==========================================================
    CONFIGURAÇÕES
    ==========================================================
    */

    const URL_BASE =
        "https://galaxia-qsms.github.io/certificados-tripulantes/?matricula=";

    const LARGURA = 1181;
    const ALTURA = 1772;

    const QR_SIZE = 531;


    let dados = {};

    let artesGeradas = [];


    /*
    ==========================================================
    CARREGAR DADOS
    ==========================================================
    */

    async function carregarDados() {

        try {

            const resposta = await fetch(
                "dados.json?t=" + Date.now()
            );

            if (!resposta.ok) {

                throw new Error(
                    "Não foi possível carregar o dados.json"
                );

            }

            dados = await resposta.json();

            const total = Object.keys(dados).length;

            document.getElementById("contador").innerHTML =
                `<strong>${total}</strong> colaborador(es) encontrado(s).`;

        }

        catch (erro) {

            console.error(erro);

            document.getElementById("contador").innerHTML =
                "❌ Erro ao carregar os colaboradores.";

        }

    }


    /*
    ==========================================================
    CRIA UMA ARTE
    ==========================================================
    */

    async function criarArte(matricula, pessoa) {

        return new Promise((resolve) => {

            const area =
                document.getElementById("area-geracao");


            /*
            CONTAINER PRINCIPAL
            */

            const arte =
                document.createElement("div");

            arte.className = "arte";


            /*
            IDENTIFICAÇÃO
            */

            const identificacao =
                document.createElement("div");

            identificacao.className =
                "identificacao";


            const nome =
                document.createElement("div");

            nome.className = "nome";

            nome.textContent =
                pessoa.nome || "Nome não informado";


            const matriculaDiv =
                document.createElement("div");

            matriculaDiv.className =
                "matricula";

            matriculaDiv.textContent =
                "Matrícula: " + matricula;


            identificacao.appendChild(nome);

            identificacao.appendChild(matriculaDiv);


            /*
            GRID
            */

            const grid =
                document.createElement("div");

            grid.className = "grid-qr";


            /*
            URL DO QR
            */

            const url =
                URL_BASE +
                encodeURIComponent(matricula);


            /*
            CRIAR OS 6 QR CODES
            */

            let qrsCriados = 0;


            for (let i = 0; i < 6; i++) {

                const box =
                    document.createElement("div");

                box.className = "qr-box";


                const qr =
                    document.createElement("div");

                qr.className = "qr";


                box.appendChild(qr);

                grid.appendChild(box);


                new QRCode(qr, {

                    text: url,

                    width: QR_SIZE,

                    height: QR_SIZE,

                    colorDark: "#000000",

                    colorLight: "#ffffff",

                    correctLevel:
                        QRCode.CorrectLevel.H

                });


                qrsCriados++;

            }


            arte.appendChild(identificacao);

            arte.appendChild(grid);

            area.appendChild(arte);


            /*
            AGUARDA OS QR CODES
            */

            setTimeout(() => {

                resolve(arte);

            }, 300);

        });

    }


    /*
    ==========================================================
    GERAR TODAS AS ARTES
    ==========================================================
    */

    async function gerarTodasAsArtes() {

        if (!Object.keys(dados).length) {

            alert(
                "Nenhum colaborador foi encontrado."
            );

            return;

        }


        const status =
            document.getElementById("status");


        status.innerHTML =
            "⏳ Gerando artes...";


        artesGeradas = [];


        const area =
            document.getElementById("area-geracao");


        area.innerHTML = "";


        const matriculas =
            Object.keys(dados);


        for (let i = 0; i < matriculas.length; i++) {

            const matricula =
                matriculas[i];

            const pessoa =
                dados[matricula];


            status.innerHTML =
                `⏳ Gerando ${i + 1} de ${matriculas.length}...`;


            const arte =
                await criarArte(
                    matricula,
                    pessoa
                );


            artesGeradas.push({

                matricula: matricula,

                nome:
                    pessoa.nome ||
                    "Sem nome",

                elemento: arte

            });

        }


        status.innerHTML =
            `✅ ${artesGeradas.length} arte(s) gerada(s).`;

    }


    /*
    ==========================================================
    CONVERTER ARTE PARA PNG
    ==========================================================
    */

    async function arteParaPNG(arte) {

        /*
        Usamos SVG + foreignObject para preservar
        exatamente o tamanho da arte.
        */

        const serializer =
            new XMLSerializer();


        const html =
            arte.outerHTML
                .replace(
                    /<script[\s\S]*?<\/script>/gi,
                    ""
                );


        const svg =
            `
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="${LARGURA}"
                 height="${ALTURA}">

                <foreignObject
                    width="100%"
                    height="100%">

                    <div xmlns="http://www.w3.org/1999/xhtml"
                         style="
                            width:${LARGURA}px;
                            height:${ALTURA}px;
                            background:white;
                         ">

                        ${html}

                    </div>

                </foreignObject>

            </svg>
            `;


        const blob =
            new Blob(
                [svg],
                {
                    type: "image/svg+xml;charset=utf-8"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const imagem =
            new Image();


        return new Promise((resolve, reject) => {

            imagem.onload = function () {

                const canvas =
                    document.createElement("canvas");


                canvas.width =
                    LARGURA;

                canvas.height =
                    ALTURA;


                const ctx =
                    canvas.getContext("2d");


                ctx.fillStyle =
                    "#ffffff";

                ctx.fillRect(
                    0,
                    0,
                    LARGURA,
                    ALTURA
                );


                ctx.drawImage(
                    imagem,
                    0,
                    0
                );


                URL.revokeObjectURL(url);


                canvas.toBlob(
                    function(blobPNG) {

                        resolve(blobPNG);

                    },
                    "image/png"
                );

            };


            imagem.onerror =
                function(error) {

                    URL.revokeObjectURL(url);

                    reject(error);

                };


            imagem.src = url;

        });

    }


    /*
    ==========================================================
    DOWNLOAD INDIVIDUAL
    ==========================================================
    */

    async function baixarArte(arteObj) {

        const blob =
            await arteParaPNG(
                arteObj.elemento
            );


        const nomeArquivo =
            sanitizarNome(
                arteObj.nome
            );


        saveAs(
            blob,

            `${arteObj.matricula}_${nomeArquivo}.png`
        );

    }


    /*
    ==========================================================
    ZIP
    ==========================================================
    */

    async function baixarTodasEmZip() {

        if (!artesGeradas.length) {

            await gerarTodasAsArtes();

        }


        if (!artesGeradas.length) {

            return;

        }


        const status =
            document.getElementById("status");


        status.innerHTML =
            "📦 Preparando ZIP...";


        const zip =
            new JSZip();


        for (
            let i = 0;
            i < artesGeradas.length;
            i++
        ) {

            const item =
                artesGeradas[i];


            status.innerHTML =
                `📦 Criando ZIP: ${i + 1} de ${artesGeradas.length}...`;


            const blob =
                await arteParaPNG(
                    item.elemento
                );


            const nomeArquivo =
                sanitizarNome(
                    item.nome
                );


            zip.file(
                `${item.matricula}_${nomeArquivo}.png`,
                blob
            );

        }


        status.innerHTML =
            "📦 Compactando arquivos...";


        const conteudo =
            await zip.generateAsync({

                type: "blob",

                compression: "DEFLATE",

                compressionOptions: {
                    level: 6
                }

            });


        saveAs(
            conteudo,
            "QR_Codes_Impressao_Galaxia.zip"
        );


        status.innerHTML =
            `✅ ZIP criado com ${artesGeradas.length} arte(s).`;

    }


    /*
    ==========================================================
    LIMPAR NOME DO ARQUIVO
    ==========================================================
    */

    function sanitizarNome(nome) {

        return String(nome)

            .normalize("NFD")

            .replace(
                /[\u0300-\u036f]/g,
                ""
            )

            .replace(
                /[^a-zA-Z0-9\s_-]/g,
                ""
            )

            .replace(
                /\s+/g,
                "_"
            )

            .substring(
                0,
                80
            );

    }


    /*
    ==========================================================
    INICIALIZAÇÃO
    ==========================================================
    */

    carregarDados();

</script>

</body>

</html>
