<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerador de QR Codes - Galáxia Navegação</title>


    <!-- Biblioteca para gerar QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
            color: #333;
        }


        .container {
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.10);
        }


        .logo {
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            color: #174a8b;
            margin-bottom: 10px;
        }


        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }


        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }


        select,
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            margin-bottom: 15px;
        }


        button {
            border: none;
            border-radius: 7px;
            padding: 12px 18px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }


        .botao-gerar {
            width: 100%;
            background: #174a8b;
            color: white;
        }


        .botao-gerar:hover {
            opacity: 0.9;
        }


        .resultado {
            display: none;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #ddd;
            text-align: center;
        }


        .nome {
            font-size: 21px;
            font-weight: bold;
            color: #222;
            margin-bottom: 8px;
        }


        .dados {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }


        #qrcode {
            display: flex;
            justify-content: center;
            margin: 20px auto;
            padding: 15px;
        }


        #qrcode img,
        #qrcode canvas {
            margin: auto;
        }


        .url {
            background: #f4f6f8;
            border: 1px solid #ddd;
            border-radius: 7px;
            padding: 12px;
            font-size: 12px;
            color: #555;
            word-break: break-all;
            margin: 20px 0;
        }


        .botao-download {
            background: #16833b;
            color: white;
            margin-top: 10px;
        }


        .botao-site {
            background: #174a8b;
            color: white;
            margin-top: 10px;
            margin-left: 5px;
        }


        .erro {
            text-align: center;
            padding: 20px;
            color: #b00020;
        }


        .carregando {
            text-align: center;
            padding: 20px;
            color: #666;
        }


        .rodape {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: #888;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">

        GALÁXIA NAVEGAÇÃO

    </div>


    <div class="subtitulo">

        Gerador de QR Code — Consulta de Certificados

    </div>


    <div id="carregando" class="carregando">

        Carregando tripulantes...

    </div>


    <div id="area-gerador" style="display:none;">


        <label for="pesquisa">

            Pesquisar tripulante

        </label>


        <input
            type="text"
            id="pesquisa"
            placeholder="Digite o nome ou matrícula..."
        >


        <label for="tripulante">

            Selecione o tripulante

        </label>


        <select id="tripulante">

            <option value="">

                Selecione...

            </option>

        </select>


        <button
            class="botao-gerar"
            onclick="gerarQRCode()"
        >

            GERAR QR CODE

        </button>


        <div id="resultado" class="resultado">


            <div id="nome" class="nome"></div>


            <div id="dados" class="dados"></div>


            <div id="qrcode"></div>


            <div id="url" class="url"></div>


            <button
                class="botao-download"
                onclick="baixarQRCode()"
            >

                ⬇ Baixar QR Code

            </button>


            <button
                class="botao-site"
                onclick="abrirSite()"
            >

                🔗 Abrir página

            </button>


        </div>


    </div>


    <div id="erro" class="erro" style="display:none;"></div>


    <div class="rodape">

        Galáxia Navegação — Controle de Certificados

    </div>


</div>



<script>


    // =========================================================
    // CONFIGURAÇÃO
    // =========================================================


    const ENDERECO_SITE =
        "https://galaxia-qsms.github.io/certificados-tripulantes/";


    let dados = {};

    let matriculaSelecionada = null;


    // =========================================================
    // CARREGAR dados.json
    // =========================================================


    fetch("dados.json")


        .then(resposta => {


            if (!resposta.ok) {

                throw new Error(
                    "Não foi possível carregar o arquivo dados.json."
                );

            }


            return resposta.json();

        })


        .then(resultado => {


            dados = resultado;


            preencherLista();


            document.getElementById("carregando").style.display = "none";

            document.getElementById("area-gerador").style.display = "block";


        })


        .catch(erro => {


            console.error(erro);


            document.getElementById("carregando").style.display = "none";


            document.getElementById("erro").style.display = "block";


            document.getElementById("erro").innerHTML = `

                <strong>Erro ao carregar os dados.</strong>

                <br><br>

                Verifique se o arquivo

                <strong>dados.json</strong>

                está no mesmo local deste arquivo.

            `;

        });



    // =========================================================
    // PREENCHER LISTA DE TRIPULANTES
    // =========================================================


    function preencherLista(filtro = "") {


        const select =
            document.getElementById("tripulante");


        select.innerHTML = `

            <option value="">

                Selecione...

            </option>

        `;


        const lista = Object.entries(dados);


        lista.sort((a, b) => {


            const nomeA =
                a[1].nome.toUpperCase();


            const nomeB =
                b[1].nome.toUpperCase();


            return nomeA.localeCompare(nomeB);

        });


        lista.forEach(([matricula, funcionario]) => {


            const nome =
                funcionario.nome || "";


            const textoBusca =
                (
                    matricula +
                    " " +
                    nome
                ).toLowerCase();


            if (
                filtro === "" ||
                textoBusca.includes(filtro.toLowerCase())
            ) {


                const option =
                    document.createElement("option");


                option.value = matricula;


                option.textContent =
                    `${nome} — Matrícula ${matricula}`;


                select.appendChild(option);

            }

        });

    }



    // =========================================================
    // PESQUISA
    // =========================================================


    document
        .getElementById("pesquisa")
        .addEventListener("input", function() {


            preencherLista(this.value);


        });



    // =========================================================
    // GERAR QR CODE
    // =========================================================


    function gerarQRCode() {


        const select =
            document.getElementById("tripulante");


        const matricula =
            select.value;


        if (!matricula) {


            alert(
                "Selecione um tripulante."
            );


            return;

        }


        matriculaSelecionada =
            matricula;


        const funcionario =
            dados[matricula];


        // -----------------------------------------------------
        // MONTA O ENDEREÇO
        // -----------------------------------------------------


        const url =
            ENDERECO_SITE +
            "?matricula=" +
            encodeURIComponent(matricula);


        // -----------------------------------------------------
        // MOSTRA DADOS
        // -----------------------------------------------------


        document.getElementById("nome").textContent =
            funcionario.nome;


        document.getElementById("dados").innerHTML = `

            <strong>Matrícula:</strong>
            ${matricula}

            <br>

            <strong>Cargo:</strong>
            ${funcionario.cargo}

        `;


        document.getElementById("url").textContent =
            url;


        // -----------------------------------------------------
        // LIMPA QR CODE ANTERIOR
        // -----------------------------------------------------


        document.getElementById("qrcode").innerHTML = "";


        // -----------------------------------------------------
        // CRIA QR CODE
        // -----------------------------------------------------


        new QRCode(
            document.getElementById("qrcode"),
            {

                text: url,

                width: 220,

                height: 220,

                colorDark: "#000000",

                colorLight: "#ffffff",

                correctLevel: QRCode.CorrectLevel.H

            }
        );


        // -----------------------------------------------------
        // MOSTRA RESULTADO
        // -----------------------------------------------------


        document.getElementById("resultado").style.display =
            "block";


    }



    // =========================================================
    // BAIXAR QR CODE
    // =========================================================


    function baixarQRCode() {


        if (!matriculaSelecionada) {

            return;

        }


        const qr =
            document.querySelector(
                "#qrcode img"
            );


        if (!qr) {

            alert(
                "Gere o QR Code primeiro."
            );

            return;

        }


        const link =
            document.createElement("a");


        link.href =
            qr.src;


        link.download =
            "QR_Code_Matricula_" +
            matriculaSelecionada +
            ".png";


        document.body.appendChild(link);


        link.click();


        document.body.removeChild(link);

    }



    // =========================================================
    // ABRIR PÁGINA
    // =========================================================


    function abrirSite() {


        if (!matriculaSelecionada) {

            return;

        }


        const url =
            ENDERECO_SITE +
            "?matricula=" +
            encodeURIComponent(
                matriculaSelecionada
            );


        window.open(
            url,
            "_blank"
        );

    }


</script>


</body>

</html>
