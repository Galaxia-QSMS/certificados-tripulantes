<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consulta de Certificados</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
            color: #333;
        }


        .container {
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.10);
        }


        .logo {
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            color: #174a8b;
            margin-bottom: 30px;
        }


        .funcionario {
            border-bottom: 1px solid #ddd;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }


        .funcionario h1 {
            font-size: 24px;
            margin: 0 0 10px 0;
            color: #222;
        }


        .dados {
            color: #666;
            line-height: 1.7;
        }


        .titulo {
            font-size: 20px;
            font-weight: bold;
            color: #174a8b;
            margin-bottom: 15px;
        }


        .certificado {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 14px;
            background: #fff;
        }


        .curso {
            font-size: 16px;
            font-weight: bold;
            color: #174a8b;
            margin-bottom: 10px;
            line-height: 1.4;
        }


        .info {
            color: #555;
            line-height: 1.7;
        }


        .botao-pdf {
            display: inline-block;
            margin-top: 12px;
            padding: 9px 14px;
            background: #174a8b;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
        }


        .botao-pdf:hover {
            opacity: 0.85;
        }


        .status {
            margin-top: 8px;
            font-weight: bold;
            color: #16833b;
        }


        .erro {
            text-align: center;
            padding: 30px 10px;
            color: #b00020;
        }


        .carregando {
            text-align: center;
            padding: 30px 10px;
            color: #666;
        }


        .rodape {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: #888;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">

        GALÁXIA NAVEGAÇÃO

    </div>


    <div id="conteudo">

        <div class="carregando">

            Carregando informações...

        </div>

    </div>


    <div class="rodape">

        Consulta de certificados — Galáxia Navegação

    </div>


</div>



<script>


    // =====================================================
    // 1. PEGAR A MATRÍCULA DA URL
    // =====================================================


    const parametros =
        new URLSearchParams(window.location.search);


    const matricula =
        parametros.get("matricula");


    const conteudo =
        document.getElementById("conteudo");



    // =====================================================
    // 2. VERIFICAR SE A MATRÍCULA FOI INFORMADA
    // =====================================================


    if (!matricula) {


        conteudo.innerHTML = `

            <div class="erro">

                <h2>Matrícula não informada</h2>

                <p>
                    Utilize o QR Code para acessar a consulta.
                </p>

            </div>

        `;


    }



    // =====================================================
    // 3. BUSCAR O ARQUIVO dados.json
    // =====================================================


    else {


        fetch("dados.json", {

            cache: "no-cache"

        })


        .then(resposta => {


            if (!resposta.ok) {

                throw new Error(
                    "Não foi possível carregar os dados."
                );

            }


            /*
             * Lê o arquivo como texto.
             * O navegador utiliza UTF-8 para interpretar
             * corretamente caracteres como:
             *
             * á é í ó ú
             * ã õ
             * ç
             * º
             */

            return resposta.text();

        })


        .then(texto => {


            // =================================================
            // 4. CONVERTER O TEXTO PARA JSON
            // =================================================


            let dados;


            try {

                dados = JSON.parse(texto);

            }


            catch (erroJSON) {

                console.error(
                    "Erro ao interpretar dados.json:",
                    erroJSON
                );

                throw new Error(
                    "O arquivo dados.json possui um problema de formatação."
                );

            }



            // =================================================
            // 5. ENCONTRAR A MATRÍCULA
            // =================================================


            const funcionario =
                dados[matricula];


            if (!funcionario) {


                conteudo.innerHTML = `

                    <div class="erro">

                        <h2>
                            Funcionário não encontrado
                        </h2>

                        <p>
                            Matrícula: ${matricula}
                        </p>

                    </div>

                `;


                return;

            }



            // =================================================
            // 6. CABEÇALHO DO FUNCIONÁRIO
            // =================================================


            let html = `

                <div class="funcionario">

                    <h1>
                        ${funcionario.nome}
                    </h1>


                    <div class="dados">

                        <strong>Matrícula:</strong>
                        ${matricula}

                        <br>

                        <strong>Cargo:</strong>
                        ${funcionario.cargo}

                    </div>

                </div>


                <div class="titulo">

                    Certificados

                </div>

            `;



            // =================================================
            // 7. MOSTRAR OS CERTIFICADOS
            // =================================================


            funcionario.certificados.forEach(
                certificado => {


                    html += `

                        <div class="certificado">


                            <div class="curso">

                                ${certificado.curso}

                            </div>


                            <div class="info">

                                Conclusão:
                                ${certificado.conclusao}

                                <br>

                                Vencimento:
                                ${certificado.vencimento}

                            </div>


                            <div class="status">

                                Certificado válido

                            </div>


                            <a
                                class="botao-pdf"
                                href="${certificado.link}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >

                                📄 Ver certificado

                            </a>


                        </div>

                    `;

                }
            );



            // =================================================
            // 8. COLOCAR TUDO NA TELA
            // =================================================


            conteudo.innerHTML =
                html;


        })


        // =====================================================
        // 9. CASO OCORRA ALGUM ERRO
        // =====================================================


        .catch(erro => {


            console.error(erro);


            conteudo.innerHTML = `

                <div class="erro">

                    <h2>
                        Erro ao carregar os dados
                    </h2>

                    <p>
                        Tente novamente mais tarde.
                    </p>

                </div>

            `;

        });

    }


</script>


</body>

</html>
