<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consulta de Certificados | Galáxia Navegação</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f6fa;
            color: #1f2933;
        }


        /* =====================================================
           CABEÇALHO
        ===================================================== */

        .topo {
            background: #ffffff;
            border-bottom: 4px solid #f2c300;
            padding: 25px 20px 22px;
            text-align: center;
        }


        .logo {
            max-width: 255px;
            width: 78%;
            height: auto;
            display: block;
            margin: 0 auto 14px;
        }


        .titulo-site {
            margin: 0;
            color: #174a8b;
            font-size: 22px;
            font-weight: 700;
        }


        .subtitulo-site {
            margin: 7px 0 0;
            color: #7a8490;
            font-size: 14px;
        }


        /* =====================================================
           CONTAINER
        ===================================================== */

        .container {
            width: 100%;
            max-width: 950px;
            margin: 32px auto;
            padding: 0 18px;
        }


        /* =====================================================
           CARD DO FUNCIONÁRIO
        ===================================================== */

        .funcionario {
            position: relative;
            overflow: hidden;

            background: #ffffff;

            border-radius: 18px;

            padding: 28px;

            margin-bottom: 30px;

            box-shadow:
                0 5px 20px rgba(23, 74, 139, 0.09);

            border: 1px solid #e3e8ee;
        }


        .funcionario::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;
            bottom: 0;

            width: 7px;

            background: #174a8b;
        }


        .funcionario-conteudo {
            padding-left: 8px;
        }


        .etiqueta {
            display: inline-block;

            font-size: 11px;

            font-weight: bold;

            color: #174a8b;

            background: #edf3fa;

            padding: 6px 10px;

            border-radius: 20px;

            text-transform: uppercase;

            letter-spacing: 0.4px;

            margin-bottom: 12px;
        }


        .funcionario h1 {
            margin: 0;

            color: #172b4d;

            font-size: 27px;

            line-height: 1.2;

            max-width: 720px;
        }


        .cargo {
            margin-top: 8px;

            color: #667085;

            font-size: 15px;

            font-weight: 500;
        }


        /* =====================================================
           INFORMAÇÕES DO FUNCIONÁRIO
        ===================================================== */

        .resumo-funcionario {
            display: flex;

            justify-content: space-between;

            align-items: stretch;

            gap: 15px;

            margin-top: 25px;
        }


        .matricula-box {
            flex: 1;

            background: #f7f9fc;

            border: 1px solid #e3e8ee;

            border-radius: 12px;

            padding: 14px 16px;
        }


        .label {
            display: block;

            font-size: 10px;

            font-weight: bold;

            color: #7b8491;

            text-transform: uppercase;

            letter-spacing: 0.6px;

            margin-bottom: 5px;
        }


        .matricula {
            color: #174a8b;

            font-size: 20px;

            font-weight: 700;
        }


        /* =====================================================
           CONTADOR
        ===================================================== */

        .contador-box {
            min-width: 170px;

            background: #174a8b;

            color: #ffffff;

            border-radius: 12px;

            padding: 13px 18px;

            text-align: center;
        }


        .contador-numero {
            display: block;

            font-size: 28px;

            line-height: 1;

            font-weight: 700;

            margin-bottom: 5px;
        }


        .contador-texto {
            display: block;

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: 0.6px;

            opacity: 0.9;

            font-weight: bold;
        }


        /* =====================================================
           TÍTULO CERTIFICADOS
        ===================================================== */

        .cabecalho-certificados {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 18px;
        }


        .titulo-certificados {
            margin: 0;

            color: #174a8b;

            font-size: 22px;
        }


        .subtitulo-certificados {
            margin: 4px 0 0;

            color: #7a8490;

            font-size: 13px;
        }


        /* =====================================================
           PESQUISA
        ===================================================== */

        .pesquisa {
            position: relative;

            margin-bottom: 20px;
        }


        .pesquisa input {
            width: 100%;

            border: 1px solid #d8dee6;

            border-radius: 10px;

            background: #ffffff;

            padding: 13px 16px 13px 42px;

            font-size: 14px;

            outline: none;

            transition: 0.2s;

            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }


        .pesquisa input:focus {
            border-color: #174a8b;

            box-shadow:
                0 0 0 3px rgba(23, 74, 139, 0.08);
        }


        .icone-pesquisa {
            position: absolute;

            left: 15px;

            top: 50%;

            transform: translateY(-50%);

            font-size: 17px;

            color: #7d8793;
        }


        /* =====================================================
           CARD CERTIFICADO
        ===================================================== */

        .certificado {
            position: relative;

            background: #ffffff;

            border: 1px solid #e0e5eb;

            border-radius: 14px;

            padding: 21px 22px 21px 25px;

            margin-bottom: 14px;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.045);

            overflow: hidden;

            transition: 0.2s;
        }


        .certificado:hover {
            transform: translateY(-2px);

            box-shadow:
                0 7px 18px rgba(0,0,0,0.08);
        }


        .certificado::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;
            bottom: 0;

            width: 5px;

            background: #16833b;
        }


        .certificado.proximo::before {
            background: #d59b00;
        }


        .certificado.vencido::before {
            background: #b00020;
        }


        /* =====================================================
           STATUS
        ===================================================== */

        .status {
            display: inline-flex;

            align-items: center;

            gap: 6px;

            font-size: 11px;

            font-weight: bold;

            text-transform: uppercase;

            letter-spacing: 0.3px;

            margin-bottom: 12px;
        }


        .status-ponto {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #16833b;
        }


        .status-valido {
            color: #16833b;
        }


        .status-proximo {
            color: #9a7000;
        }


        .status-proximo .status-ponto {
            background: #d59b00;
        }


        .status-vencido {
            color: #b00020;
        }


        .status-vencido .status-ponto {
            background: #b00020;
        }


        /* =====================================================
           CURSO
        ===================================================== */

        .curso {
            color: #174a8b;

            font-size: 16px;

            font-weight: 700;

            line-height: 1.45;

            margin-bottom: 17px;
        }


        /* =====================================================
           DATAS
        ===================================================== */

        .informacoes {
            display: flex;

            gap: 12px;

            margin-bottom: 17px;
        }


        .informacao {
            background: #f7f9fb;

            border-radius: 9px;

            padding: 11px 14px;

            min-width: 150px;

            border: 1px solid #edf0f3;
        }


        .informacao-label {
            display: block;

            font-size: 10px;

            font-weight: bold;

            color: #7c8793;

            text-transform: uppercase;

            margin-bottom: 5px;

            letter-spacing: 0.4px;
        }


        .informacao-valor {
            font-size: 14px;

            color: #303b48;

            font-weight: 700;
        }


        /* =====================================================
           BOTÃO
        ===================================================== */

        .botao-pdf {
            display: inline-flex;

            align-items: center;

            gap: 7px;

            background: #174a8b;

            color: #ffffff;

            text-decoration: none;

            padding: 10px 16px;

            border-radius: 7px;

            font-size: 13px;

            font-weight: bold;

            transition: 0.2s;
        }


        .botao-pdf:hover {
            background: #123b70;

            transform: translateY(-1px);
        }


        /* =====================================================
           SEM RESULTADOS
        ===================================================== */

        .sem-resultados {
            display: none;

            background: #ffffff;

            border-radius: 12px;

            padding: 30px;

            text-align: center;

            color: #777;

            border: 1px solid #e2e6eb;
        }


        /* =====================================================
           ERRO
        ===================================================== */

        .erro {
            background: #ffffff;

            border-radius: 15px;

            padding: 45px 20px;

            text-align: center;

            color: #b00020;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.07);
        }


        .erro h2 {
            margin-top: 0;
        }


        /* =====================================================
           CARREGANDO
        ===================================================== */

        .carregando {
            background: #ffffff;

            border-radius: 15px;

            padding: 50px 20px;

            text-align: center;

            color: #666;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.07);
        }


        /* =====================================================
           RODAPÉ
        ===================================================== */

        .rodape {
            text-align: center;

            padding: 25px 15px 35px;

            color: #89919b;

            font-size: 11px;
        }


        /* =====================================================
           CELULAR
        ===================================================== */

        @media (max-width: 600px) {


            .topo {
                padding: 20px 15px 18px;
            }


            .logo {
                max-width: 215px;
            }


            .titulo-site {
                font-size: 19px;
            }


            .subtitulo-site {
                font-size: 12px;
            }


            .container {
                margin-top: 18px;

                padding: 0 12px;
            }


            .funcionario {
                padding: 22px 19px;
            }


            .funcionario h1 {
                font-size: 21px;
            }


            .resumo-funcionario {
                display: block;
            }


            .matricula-box {
                margin-bottom: 10px;
            }


            .contador-box {
                min-width: 0;
            }


            .cabecalho-certificados {
                display: block;
            }


            .titulo-certificados {
                font-size: 20px;

                margin-bottom: 4px;
            }


            .certificado {
                padding: 18px 17px 18px 20px;
            }


            .curso {
                font-size: 15px;
            }


            .informacoes {
                display: block;
            }


            .informacao {
                margin-bottom: 8px;

                min-width: 0;
            }


            .botao-pdf {
                width: 100%;

                justify-content: center;
            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     CABEÇALHO
========================================================= -->

<header class="topo">


    <img
        class="logo"
        src="Logo%20-%20Fonte%20Azul.png"
        alt="Galáxia Navegação"
    >


    <h1 class="titulo-site">
        Consulta de Certificados
    </h1>


    <p class="subtitulo-site">
        Controle de capacitação dos tripulantes
    </p>


</header>



<!-- =========================================================
     CONTEÚDO
========================================================= -->

<main class="container">


    <div id="conteudo">


        <div class="carregando">
            Carregando informações...
        </div>


    </div>


</main>



<!-- =========================================================
     RODAPÉ
========================================================= -->

<footer class="rodape">

    Galáxia Navegação • Consulta de certificados

</footer>



<script>


    // =====================================================
    // 1. PEGAR MATRÍCULA DA URL
    // =====================================================

    const parametros =
        new URLSearchParams(window.location.search);


    const matricula =
        parametros.get("matricula");


    const conteudo =
        document.getElementById("conteudo");



    // =====================================================
    // 2. VERIFICAR MATRÍCULA
    // =====================================================

    if (!matricula) {


        conteudo.innerHTML = `

            <div class="erro">

                <h2>Matrícula não informada</h2>

                <p>
                    Utilize o QR Code para acessar a consulta.
                </p>

            </div>

        `;

    }


    // =====================================================
    // 3. BUSCAR DADOS
    // =====================================================

    else {


        fetch("dados.json", {

            cache: "no-cache"

        })


        .then(resposta => {


            if (!resposta.ok) {

                throw new Error(
                    "Não foi possível carregar os dados."
                );

            }


            return resposta.text();

        })


        .then(texto => {


            let dados;


            try {

                dados =
                    JSON.parse(texto);

            }


            catch (erroJSON) {

                console.error(
                    "Erro no dados.json:",
                    erroJSON
                );

                throw new Error(
                    "Problema ao interpretar o dados.json."
                );

            }


            // =================================================
            // 4. ENCONTRAR FUNCIONÁRIO
            // =================================================

            const funcionario =
                dados[matricula];


            if (!funcionario) {


                conteudo.innerHTML = `

                    <div class="erro">

                        <h2>
                            Funcionário não encontrado
                        </h2>

                        <p>
                            Matrícula: ${matricula}
                        </p>

                    </div>

                `;


                return;

            }


            // =================================================
            // 5. CABEÇALHO DO FUNCIONÁRIO
            // =================================================

            let html = `

                <section class="funcionario">

                    <div class="funcionario-conteudo">

                        <span class="etiqueta">
                            Tripulante
                        </span>


                        <h1>
                            ${funcionario.nome}
                        </h1>


                        <div class="cargo">
                            ${funcionario.cargo}
                        </div>


                        <div class="resumo-funcionario">


                            <div class="matricula-box">

                                <span class="label">
                                    Matrícula
                                </span>

                                <span class="matricula">
                                    ${matricula}
                                </span>

                            </div>


                            <div class="contador-box">

                                <span class="contador-numero">
                                    ${funcionario.certificados.length}
                                </span>

                                <span class="contador-texto">
                                    Certificados
                                </span>

                            </div>


                        </div>

                    </div>

                </section>



                <div class="cabecalho-certificados">

                    <div>

                        <h2 class="titulo-certificados">
                            Certificados
                        </h2>

                        <p class="subtitulo-certificados">
                            Consulte os certificados disponíveis
                        </p>

                    </div>

                </div>



                <div class="pesquisa">

                    <span class="icone-pesquisa">
                        🔎
                    </span>

                    <input
                        type="text"
                        id="pesquisaCertificado"
                        placeholder="Pesquisar certificado..."
                    >

                </div>


                <div id="listaCertificados">

            `;


            // =================================================
            // 6. CERTIFICADOS
            // =================================================

            funcionario.certificados.forEach(
                (certificado, indice) => {


                    // -----------------------------------------
                    // DATA DE VENCIMENTO
                    // -----------------------------------------

                    const partes =
                        certificado.vencimento.split("/");


                    const dataVencimento =
                        new Date(
                            partes[2],
                            partes[1] - 1,
                            partes[0]
                        );


                    const hoje =
                        new Date();


                    hoje.setHours(
                        0,
                        0,
                        0,
                        0
                    );


                    const diferenca =
                        dataVencimento - hoje;


                    const diasRestantes =
                        Math.ceil(
                            diferenca /
                            (1000 * 60 * 60 * 24)
                        );


                    // -----------------------------------------
                    // STATUS
                    // -----------------------------------------

                    let statusTexto;
                    let statusClasse;
                    let classeCard;


                    if (diasRestantes < 0) {


                        statusTexto =
                            "Vencido";


                        statusClasse =
                            "status status-vencido";


                        classeCard =
                            "certificado vencido";


                    }


                    else if (diasRestantes <= 90) {


                        statusTexto =
                            "Próximo do vencimento";


                        statusClasse =
                            "status status-proximo";


                        classeCard =
                            "certificado proximo";


                    }


                    else {


                        statusTexto =
                            "Válido";


                        statusClasse =
                            "status status-valido";


                        classeCard =
                            "certificado";

                    }


                    // -----------------------------------------
                    // CARD
                    // -----------------------------------------

                    html += `

                        <article
                            class="${classeCard}"
                            data-curso="${certificado.curso.toLowerCase()}"
                        >


                            <div class="${statusClasse}">

                                <span class="status-ponto"></span>

                                ${statusTexto}

                            </div>


                            <div class="curso">

                                ${certificado.curso}

                            </div>


                            <div class="informacoes">


                                <div class="informacao">

                                    <span class="informacao-label">
                                        Conclusão
                                    </span>

                                    <span class="informacao-valor">
                                        ${certificado.conclusao}
                                    </span>

                                </div>


                                <div class="informacao">

                                    <span class="informacao-label">
                                        Vencimento
                                    </span>

                                    <span class="informacao-valor">
                                        ${certificado.vencimento}
                                    </span>

                                </div>


                            </div>


                            <a
                                class="botao-pdf"
                                href="${certificado.link}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >

                                📄 Ver certificado

                            </a>


                        </article>

                    `;

                }
            );


            // =================================================
            // 7. FINALIZAR LISTA
            // =================================================

            html += `

                </div>


                <div
                    id="semResultados"
                    class="sem-resultados"
                >

                    <strong>
                        Nenhum certificado encontrado.
                    </strong>

                    <br>

                    <small>
                        Tente pesquisar por outro termo.
                    </small>

                </div>

            `;


            // =================================================
            // 8. COLOCAR NA TELA
            // =================================================

            conteudo.innerHTML =
                html;



            // =================================================
            // 9. PESQUISA
            // =================================================

            const campoPesquisa =
                document.getElementById(
                    "pesquisaCertificado"
                );


            const cards =
                document.querySelectorAll(
                    ".certificado"
                );


            const semResultados =
                document.getElementById(
                    "semResultados"
                );


            campoPesquisa.addEventListener(
                "input",
                function () {


                    const termo =
                        this.value
                            .toLowerCase()
                            .trim();


                    let encontrados = 0;


                    cards.forEach(card => {


                        const curso =
                            card.dataset.curso;


                        if (
                            curso.includes(termo)
                        ) {


                            card.style.display =
                                "";


                            encontrados++;

                        }


                        else {


                            card.style.display =
                                "none";

                        }

                    });


                    if (encontrados === 0) {


                        semResultados.style.display =
                            "block";


                    }


                    else {


                        semResultados.style.display =
                            "none";

                    }

                }
            );


        })


        // =====================================================
        // 10. ERRO
        // =====================================================

        .catch(erro => {


            console.error(erro);


            conteudo.innerHTML = `

                <div class="erro">

                    <h2>
                        Erro ao carregar os dados
                    </h2>

                    <p>
                        Tente novamente mais tarde.
                    </p>

                </div>

            `;

        });

    }


</script>


</body>

</html>
