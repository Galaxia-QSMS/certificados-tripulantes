<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consulta de Certificados</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.10);
        }

        .logo {
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            color: #174a8b;
            margin-bottom: 30px;
        }

        .funcionario {
            border-bottom: 1px solid #ddd;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .funcionario h1 {
            font-size: 24px;
            margin: 0 0 10px 0;
            color: #222;
        }

        .dados {
            color: #666;
            line-height: 1.7;
        }

        .titulo {
            font-size: 20px;
            font-weight: bold;
            color: #174a8b;
            margin-bottom: 15px;
        }

        .certificado {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 14px;
            background: #fff;
        }

        .curso {
            font-size: 16px;
            font-weight: bold;
            color: #174a8b;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .info {
            color: #555;
            line-height: 1.7;
        }

        .status {
            margin-top: 8px;
            font-weight: bold;
            color: #16833b;
        }

        .erro {
            text-align: center;
            padding: 30px 10px;
            color: #b00020;
        }

        .rodape {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        GALÁXIA NAVEGAÇÃO
    </div>

    <div id="conteudo"></div>

    <div class="rodape">
        Consulta de certificados — Galáxia Navegação
    </div>

</div>


<script>

    /*
     * BASE DE TESTE
     *
     * Por enquanto vamos trabalhar somente
     * com duas matrículas:
     *
     * 261 = Elison
     * 3   = Adilson
     */

    const funcionarios = {

        "261": {
            nome: "ELISON DA SILVA FIRMINO",
            cargo: "ELETRICISTA",

            certificados: [
                {
                    curso: "NR 06 - EQUIPAMENTOS DE PROTEÇÃO INDIVIDUAL (EPI) - PRESENCIAL",
                    conclusao: "16/01/2026",
                    vencimento: "16/01/2028"
                },
                {
                    curso: "NR 20 - SEGURANÇA NO TRABALHO COM INFLAMÁVEIS E COMBUSTÍVEIS (INTERMEDIÁRIO) - PRESENCIAL",
                    conclusao: "05/02/2026",
                    vencimento: "05/02/2028"
                },
                {
                    curso: "NR 26 - SEGURANÇA NO MANUSEIO DE PRODUTOS PERIGOSOS - PRESENCIAL",
                    conclusao: "29/01/2026",
                    vencimento: "29/01/2028"
                },
                {
                    curso: "NR 30 - SEGURANÇA NO TRABALHO AQUAVIÁRIO - CAPACITAÇÃO INICIAL - PRESENCIAL",
                    conclusao: "15/01/2026",
                    vencimento: "15/01/2028"
                },
                {
                    curso: "NR 34 - CONDIÇÕES DE TRABALHO NA INDÚSTRIA DA CONSTRUÇÃO E REPARAÇÃO NAVAL (ADMISSIONAL/PERIÓDICO) - PRESENCIAL",
                    conclusao: "15/01/2026",
                    vencimento: "15/01/2027"
                },
                {
                    curso: "NR 34 - CONDIÇÕES DE TRABALHO NA INDÚSTRIA DA CONSTRUÇÃO E REPARAÇÃO NAVAL (BÁSICO TRABALHO A QUENTE) - PRESENCIAL",
                    conclusao: "27/01/2026",
                    vencimento: "27/01/2027"
                },
                {
                    curso: "NR 10 - SEGURANÇA EM INSTALAÇÕES E SERVIÇOS EM ELETRICIDADE (BÁSICO) - PRESENCIAL",
                    conclusao: "11/02/2026",
                    vencimento: "11/02/2028"
                },
                {
                    curso: "NR 12 - SEGURANÇA NO TRABALHO EM MÁQUINAS E EQUIPAMENTOS - PRESENCIAL",
                    conclusao: "29/01/2026",
                    vencimento: "29/01/2028"
                },
                {
                    curso: "NR 34 - CURSO BÁSICO DE SEGURANÇA EM OPERAÇÕES DE MOVIMENTAÇÃO DE CARGAS - PRESENCIAL",
                    conclusao: "01/02/2026",
                    vencimento: "01/02/2028"
                },
                {
                    curso: "NR 13 - CALDEIRAS, VASOS DE PRESSÃO E TUBULAÇÃO (OPERAÇÃO DE CALDEIRAS)",
                    conclusao: "16/04/2026",
                    vencimento: "16/04/2029"
                },
                {
                    curso: "NR 34 - CONDIÇÕES DE TRABALHO NA INDÚSTRIA DA CONSTRUÇÃO E REPARAÇÃO NAVAL (OBSERVADOR DE TRABALHO A QUENTE) - PRESENCIAL",
                    conclusao: "27/01/2026",
                    vencimento: "27/01/2027"
                },
                {
                    curso: "NR 34 - CONDIÇÕES DE TRABALHO NA INDÚSTRIA DA CONSTRUÇÃO E REPARAÇÃO NAVAL (OPERADORES DE EQUIPAMENTO DE GUINDAR) - PRESENCIAL",
                    conclusao: "03/02/2026",
                    vencimento: "03/02/2028"
                },
                {
                    curso: "NR 35 - TRABALHO EM ALTURA - PRESENCIAL",
                    conclusao: "20/01/2026",
                    vencimento: "20/01/2028"
                },
                {
                    curso: "NR 35 - RESGATE EM ALTURA (EQUIPE DE RESGATE E SALVAMENTO) - NÍVEL COORDENADOR - PRESENCIAL",
                    conclusao: "22/01/2026",
                    vencimento: "22/01/2028"
                },
                {
                    curso: "NR 33 - RESGATE EM ESPAÇO CONFINADO (EQUIPE DE RESGATE E SALVAMENTO) - NÍVEL COORDENADOR - PRESENCIAL",
                    conclusao: "25/01/2026",
                    vencimento: "25/01/2028"
                },
                {
                    curso: "OPERAÇÃO DO SISTEMA ACON",
                    conclusao: "01/02/2026",
                    vencimento: "01/02/2027"
                }
            ]
        },


        "3": {
            nome: "ADILSON MACEDO AMARAL",
            cargo: "COLOQUE O CARGO AQUI",

            certificados: [
                {
                    curso: "TESTE - CERTIFICADO",
                    conclusao: "01/01/2026",
                    vencimento: "01/01/2028"
                }
            ]
        }

    };


    /*
     * PEGA A MATRÍCULA DA URL
     *
     * Exemplo:
     *
     * ?matricula=261
     */

    const parametros = new URLSearchParams(window.location.search);

    const matricula = parametros.get("matricula");


    const conteudo = document.getElementById("conteudo");


    /*
     * SE NÃO TIVER MATRÍCULA
     */

    if (!matricula) {

        conteudo.innerHTML = `
            <div class="erro">
                <h2>Matrícula não informada</h2>
                <p>Utilize o QR Code para acessar a consulta.</p>
            </div>
        `;

    }


    /*
     * PROCURA O FUNCIONÁRIO
     */

    else if (!funcionarios[matricula]) {

        conteudo.innerHTML = `
            <div class="erro">
                <h2>Funcionário não encontrado</h2>
                <p>Matrícula: ${matricula}</p>
            </div>
        `;

    }


    /*
     * MOSTRA O FUNCIONÁRIO
     */

    else {

        const funcionario = funcionarios[matricula];


        let html = `

            <div class="funcionario">

                <h1>
                    ${funcionario.nome}
                </h1>

                <div class="dados">

                    <strong>Matrícula:</strong>
                    ${matricula}

                    <br>

                    <strong>Cargo:</strong>
                    ${funcionario.cargo}

                </div>

            </div>


            <div class="titulo">
                Certificados
            </div>

        `;


        /*
         * ADICIONA CADA CERTIFICADO
         */

        funcionario.certificados.forEach(certificado => {

            html += `

                <div class="certificado">

                    <div class="curso">
                        ${certificado.curso}
                    </div>

                    <div class="info">

                        Conclusão:
                        ${certificado.conclusao}

                        <br>

                        Vencimento:
                        ${certificado.vencimento}

                    </div>

                    <div class="status">
                        Certificado válido
                    </div>

                </div>

            `;

        });


        conteudo.innerHTML = html;

    }

</script>

</body>
</html>
