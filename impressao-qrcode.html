<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Impressão de QR Codes | Galáxia Navegação</title>


    <!-- QR CODE -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- JS PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 30px;

            background: #f2f4f7;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #222;

        }


        .painel {

            max-width: 900px;

            margin: 0 auto;

            background: #ffffff;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 3px 15px rgba(0,0,0,.10);

        }


        h1 {

            margin: 0 0 10px;

            font-size: 26px;

        }


        p {

            margin: 7px 0;

            color: #555;

        }


        .informacoes {

            margin-top: 20px;

            padding: 15px;

            background: #f7f7f7;

            border-radius: 8px;

            line-height: 1.7;

        }


        .botoes {

            display: flex;

            flex-wrap: wrap;

            gap: 12px;

            margin-top: 25px;

        }


        button {

            border: none;

            border-radius: 8px;

            padding: 14px 22px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

        }


        .btn-pdf {

            background: #0066cc;

            color: white;

        }


        .btn-pdf:hover {

            background: #0052a3;

        }


        button:disabled {

            opacity: .6;

            cursor: not-allowed;

        }


        #status {

            margin-top: 20px;

            font-weight: bold;

            line-height: 1.6;

        }


        .barra {

            width: 100%;

            height: 14px;

            background: #e5e7eb;

            border-radius: 10px;

            overflow: hidden;

            margin-top: 12px;

            display: none;

        }


        .progresso {

            width: 0%;

            height: 100%;

            background: #0066cc;

            transition: width .2s;

        }


        /*
        =====================================================
        ÁREA OCULTA PARA GERAR OS QR CODES
        =====================================================
        */

        #area-qr {

            position: absolute;

            left: -100000px;

            top: 0;

            width: 300px;

            height: 300px;

            background: white;

        }


        /*
        =====================================================
        QR CODE TEMPORÁRIO
        =====================================================
        */

        #qr-temporario {

            width: 512px;

            height: 512px;

            background: white;

        }

    </style>

</head>


<body>


<div class="painel">


    <h1>
        🖨️ Impressão de QR Codes
    </h1>


    <p>
        Geração automática das etiquetas dos tripulantes.
    </p>


    <div class="informacoes">

        <div>
            📄 <strong>Tamanho da página:</strong>
            10 × 15 cm
        </div>

        <div>
            🔲 <strong>QR Codes por tripulante:</strong>
            6
        </div>

        <div>
            📐 <strong>Tamanho de cada QR:</strong>
            4,5 × 4,5 cm
        </div>

        <div>
            👤 <strong>Fonte dos dados:</strong>
            dados.json
        </div>

    </div>


    <div
        id="contador"
        style="margin-top:20px;font-weight:bold;">

        Carregando colaboradores...

    </div>


    <div class="botoes">

        <button
            id="btnPDF"
            class="btn-pdf"
            onclick="gerarPDF()">

            📄 GERAR PDF PARA IMPRESSÃO

        </button>

    </div>


    <div id="status"></div>


    <div
        id="barra"
        class="barra">

        <div
            id="progresso"
            class="progresso">
        </div>

    </div>


</div>


<!--
=========================================================
ÁREA OCULTA
=========================================================
-->

<div id="area-qr">

    <div id="qr-temporario"></div>

</div>


<script>


/*
=========================================================
CONFIGURAÇÕES
=========================================================
*/


const DADOS_URL =
    "https://galaxia-qsms.github.io/certificados-tripulantes/dados.json";


const URL_SITE =
    "https://galaxia-qsms.github.io/certificados-tripulantes/?matricula=";


/*
Página PDF:

100 mm x 150 mm
= 10 cm x 15 cm
*/


const PAGINA_LARGURA = 100;

const PAGINA_ALTURA = 150;


/*
QR:

45 mm x 45 mm
= 4,5 cm x 4,5 cm
*/


const QR_MM = 45;


/*
Posições dos QR Codes

2 colunas
3 linhas
*/


const QR_X = [
    3,
    52
];


const QR_Y = [
    35,
    82,
    129
];


let dados = {};


/*
=========================================================
CARREGAR DADOS
=========================================================
*/


async function carregarDados() {

    try {

        const resposta =
            await fetch(
                DADOS_URL +
                "?t=" +
                Date.now()
            );


        if (!resposta.ok) {

            throw new Error(
                "HTTP " +
                resposta.status
            );

        }


        dados =
            await resposta.json();


        if (
            !dados ||
            typeof dados !== "object"
        ) {

            throw new Error(
                "Formato inválido do dados.json."
            );

        }


        const total =
            Object.keys(dados).length;


        document.getElementById(
            "contador"
        ).innerHTML =

            `👥 <strong>${total}</strong> colaborador(es) encontrado(s).`;


    }

    catch (erro) {

        console.error(
            erro
        );


        document.getElementById(
            "contador"
        ).innerHTML =

            "❌ Não foi possível carregar o dados.json.";

    }

}



/*
=========================================================
CRIAR QR CODE TEMPORÁRIO
=========================================================
*/


function criarQR(matricula) {

    return new Promise(
        resolve => {

            const container =
                document.getElementById(
                    "qr-temporario"
                );


            container.innerHTML =
                "";


            new QRCode(
                container,

                {

                    text:
                        URL_SITE +
                        encodeURIComponent(
                            matricula
                        ),

                    width:
                        512,

                    height:
                        512,

                    colorDark:
                        "#000000",

                    colorLight:
                        "#ffffff",

                    correctLevel:
                        QRCode.CorrectLevel.H

                }
            );


            /*
            Aguarda o QR ser desenhado
            */

            setTimeout(
                () => {

                    const canvas =
                        container.querySelector(
                            "canvas"
                        );


                    const imagem =
                        container.querySelector(
                            "img"
                        );


                    if (canvas) {

                        resolve(
                            canvas.toDataURL(
                                "image/png"
                            )
                        );

                    }

                    else if (imagem) {

                        resolve(
                            imagem.src
                        );

                    }

                    else {

                        resolve(
                            null
                        );

                    }

                },

                150
            );

        }
    );

}



/*
=========================================================
LIMPAR NOME
=========================================================
*/


function limparNome(nome) {

    return String(nome)

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .replace(
            /[^a-zA-Z0-9\s_-]/g,
            ""
        )

        .replace(
            /\s+/g,
            "_"
        );

}



/*
=========================================================
ADAPTAR NOME PARA CABER
=========================================================
*/


function ajustarNome(
    pdf,
    nome
) {

    let tamanho = 11;


    /*
    Limite da área:

    aproximadamente 94 mm
    */


    while (
        tamanho > 6
    ) {

        pdf.setFontSize(
            tamanho
        );


        const largura =
            pdf.getTextWidth(
                nome
            );


        if (
            largura <= 94
        ) {

            break;

        }


        tamanho -= 0.5;

    }


    return tamanho;

}



/*
=========================================================
GERAR PDF
=========================================================
*/


async function gerarPDF() {


    const matriculas =
        Object.keys(dados);


    if (
        matriculas.length === 0
    ) {

        alert(
            "Nenhum colaborador foi encontrado."
        );

        return;

    }


    const botao =
        document.getElementById(
            "btnPDF"
        );


    const status =
        document.getElementById(
            "status"
        );


    const barra =
        document.getElementById(
            "barra"
        );


    const progresso =
        document.getElementById(
            "progresso"
        );


    /*
    Desabilita botão
    */

    botao.disabled =
        true;


    barra.style.display =
        "block";


    progresso.style.width =
        "0%";


    status.innerHTML =
        "⏳ Preparando PDF...";


    /*
    =====================================================
    CRIAR PDF
    =====================================================
    */


    const {
        jsPDF
    } = window.jspdf;


    const pdf =
        new jsPDF({

            orientation:
                "portrait",

            unit:
                "mm",

            format:
                [
                    PAGINA_LARGURA,
                    PAGINA_ALTURA
                ],

            compress:
                true

        });


    /*
    =====================================================
    PROCESSAR CADA TRIPULANTE
    =====================================================
    */


    for (
        let i = 0;
        i < matriculas.length;
        i++
    ) {


        const matricula =
            matriculas[i];


        const pessoa =
            dados[matricula];


        /*
        Atualiza progresso
        */

        const percentual =
            Math.round(
                (
                    i /
                    matriculas.length
                ) * 100
            );


        progresso.style.width =
            percentual + "%";


        status.innerHTML =

            `⏳ Gerando página ${i + 1} de ${matriculas.length} — ${pessoa.nome || "Sem nome"}...`;


        /*
        =================================================
        PÁGINA
        =================================================
        */


        if (i > 0) {

            pdf.addPage(
                [
                    PAGINA_LARGURA,
                    PAGINA_ALTURA
                ],

                "portrait"
            );

        }


        /*
        =================================================
        FUNDO BRANCO
        =================================================
        */

        pdf.setFillColor(
            255,
            255,
            255
        );


        pdf.rect(
            0,
            0,
            PAGINA_LARGURA,
            PAGINA_ALTURA,
            "F"
        );


        /*
        =================================================
        NOME
        =================================================
        */


        const nome =
            String(
                pessoa.nome ||
                "Nome não informado"
            ).toUpperCase();


        const tamanhoFonte =
            ajustarNome(
                pdf,
                nome
            );


        pdf.setFont(
            "helvetica",
            "bold"
        );


        pdf.setFontSize(
            tamanhoFonte
        );


        pdf.setTextColor(
            0,
            0,
            0
        );


        pdf.text(
            nome,
            50,
            10,
            {
                align:
                    "center"
            }
        );


        /*
        =================================================
        MATRÍCULA
        =================================================
        */


        pdf.setFontSize(
            7
        );


        pdf.text(
            "MATRÍCULA: " +
            matricula,
            50,
            17,
            {
                align:
                    "center"
            }
        );


        /*
        =================================================
        GERAR QR
        =================================================
        */


        const qrImagem =
            await criarQR(
                matricula
            );


        if (!qrImagem) {

            console.error(
                "QR não gerado:",
                matricula
            );

            continue;

        }


        /*
        =================================================
        INSERIR OS 6 QR CODES
        =================================================
        */


        for (
            let linha = 0;
            linha < 3;
            linha++
        ) {

            for (
                let coluna = 0;
                coluna < 2;
                coluna++
            ) {


                const x =
                    QR_X[coluna];


                const y =
                    QR_Y[linha];


                pdf.addImage(

                    qrImagem,

                    "PNG",

                    x,

                    y,

                    QR_MM,

                    QR_MM,

                    undefined,

                    "FAST"

                );

            }

        }


        /*
        =================================================
        PEQUENO RESPIRO PARA O NAVEGADOR
        =================================================
        */

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    10
                )
        );

    }


    /*
    =====================================================
    FINALIZA
    =====================================================
    */


    progresso.style.width =
        "100%";


    status.innerHTML =
        "💾 Finalizando PDF...";


    /*
    Pequena pausa para garantir
    que o navegador concluiu a renderização.
    */

    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                300
            )
    );


    /*
    =====================================================
    SALVAR
    =====================================================
    */


    pdf.save(
        "QR_Codes_Galaxia_10x15.pdf"
    );


    status.innerHTML =

        `✅ PDF gerado com sucesso! ${matriculas.length} página(s), uma para cada tripulante.`;


    botao.disabled =
        false;

}



/*
=========================================================
INICIAR
=========================================================
*/


carregarDados();


</script>


</body>

</html>
