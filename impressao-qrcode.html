<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Impressão de QR Codes | Galáxia Navegação</title>

    <!-- QR CODE -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- JSZIP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- HTML2CANVAS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- FILESAVER -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            padding: 30px;

            background: #f2f4f7;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #222;

        }


        .painel {

            max-width: 1000px;

            margin: 0 auto 30px;

            background: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 3px 12px rgba(0,0,0,.10);

        }


        .painel h1 {

            margin: 0 0 10px;

            font-size: 26px;

        }


        .painel p {

            margin: 6px 0;

            color: #555;

        }


        .info {

            margin-top: 15px;

            font-weight: bold;

        }


        .botoes {

            display: flex;

            flex-wrap: wrap;

            gap: 12px;

            margin-top: 20px;

        }


        button {

            border: none;

            padding: 13px 20px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 15px;

            font-weight: bold;

        }


        .btn-gerar {

            background: #0066cc;

            color: white;

        }


        .btn-zip {

            background: #198754;

            color: white;

        }


        button:hover {

            opacity: .9;

        }


        #status {

            margin-top: 18px;

            font-weight: bold;

        }


        /*
        =====================================================
        ÁREA DAS ARTES
        =====================================================
        */

        #artes {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 30px;

        }


        /*
        =====================================================
        ARTE

        10 cm x 15 cm

        300 DPI

        1181 x 1772 px
        =====================================================
        */

        .arte {

            width: 1181px;

            height: 1772px;

            background: white;

            display: flex;

            flex-direction: column;

            align-items: center;

            padding-top: 45px;

            overflow: hidden;

            position: relative;

        }


        /*
        =====================================================
        CABEÇALHO
        =====================================================
        */

        .cabecalho {

            width: 1080px;

            height: 170px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            margin-bottom: 10px;

        }


        .nome {

            width: 1050px;

            font-size: 40px;

            font-weight: bold;

            line-height: 1.1;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        .matricula {

            margin-top: 12px;

            font-size: 28px;

            font-weight: bold;

        }


        /*
        =====================================================
        GRID
        =====================================================
        */

        .grid {

            width: 1062px;

            height: 1593px;

            display: grid;

            grid-template-columns:
                531px
                531px;

            grid-template-rows:
                531px
                531px
                531px;

        }


        .qr-container {

            width: 531px;

            height: 531px;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .qr {

            width: 531px;

            height: 531px;

        }


        /*
        =====================================================
        OCULTAR ÁREA DE GERAÇÃO
        =====================================================
        */

        #area-geracao {

            position: absolute;

            left: -100000px;

            top: 0;

        }

    </style>

</head>


<body>


<div class="painel">

    <h1>
        🖨️ Impressão de QR Codes
    </h1>

    <p>
        Geração automática das artes para impressão.
    </p>

    <p>
        <strong>Formato:</strong>
        10 × 15 cm
    </p>

    <p>
        <strong>QR Codes:</strong>
        6 por tripulante — aproximadamente 4,5 × 4,5 cm cada.
    </p>


    <div
        id="contador"
        class="info">

        Carregando colaboradores...

    </div>


    <div class="botoes">

        <button
            class="btn-gerar"
            onclick="gerarTodas()">

            🖨️ GERAR ARTES DE TODOS

        </button>


        <button
            class="btn-zip"
            onclick="baixarZIP()">

            📦 BAIXAR TODAS EM ZIP

        </button>

    </div>


    <div id="status"></div>

</div>


<!-- ÁREA OCULTA DE GERAÇÃO -->

<div id="area-geracao"></div>


<!-- ARTES GERADAS -->

<div id="artes"></div>


<script>


/*
=========================================================
CONFIGURAÇÕES
=========================================================
*/


const DADOS_URL =
    "https://galaxia-qsms.github.io/certificados-tripulantes/dados.json";


const URL_CERTIFICADO =
    "https://galaxia-qsms.github.io/certificados-tripulantes/?matricula=";


const QR_SIZE = 531;


let dados = {};

let listaArtes = [];



/*
=========================================================
CARREGAR DADOS
=========================================================
*/


async function carregarDados() {

    try {

        const resposta = await fetch(
            DADOS_URL + "?t=" + Date.now()
        );


        if (!resposta.ok) {

            throw new Error(
                "Erro HTTP " + resposta.status
            );

        }


        dados = await resposta.json();


        /*
        CONFERE SE É OBJETO
        */

        if (
            !dados ||
            typeof dados !== "object"
        ) {

            throw new Error(
                "Formato inválido do dados.json"
            );

        }


        const total =
            Object.keys(dados).length;


        document.getElementById(
            "contador"
        ).innerHTML =

            `👥 <strong>${total}</strong> colaborador(es) encontrado(s).`;


    }

    catch (erro) {

        console.error(
            "Erro ao carregar dados.json:",
            erro
        );


        document.getElementById(
            "contador"
        ).innerHTML =

            "❌ Não foi possível carregar o dados.json.";

    }

}



/*
=========================================================
CRIAR QR CODE
=========================================================
*/


function criarQRCode(elemento, matricula) {

    new QRCode(

        elemento,

        {

            text:
                URL_CERTIFICADO +
                encodeURIComponent(matricula),

            width:
                QR_SIZE,

            height:
                QR_SIZE,

            colorDark:
                "#000000",

            colorLight:
                "#ffffff",

            correctLevel:
                QRCode.CorrectLevel.H

        }

    );

}



/*
=========================================================
CRIAR ARTE
=========================================================
*/


async function criarArte(
    matricula,
    pessoa
) {

    return new Promise(
        resolve => {

            const arte =
                document.createElement(
                    "div"
                );


            arte.className =
                "arte";


            /*
            CABEÇALHO
            */

            const cabecalho =
                document.createElement(
                    "div"
                );


            cabecalho.className =
                "cabecalho";


            const nome =
                document.createElement(
                    "div"
                );


            nome.className =
                "nome";


            nome.textContent =
                pessoa.nome ||
                "Nome não informado";


            const matriculaDiv =
                document.createElement(
                    "div"
                );


            matriculaDiv.className =
                "matricula";


            matriculaDiv.textContent =
                "Matrícula: " +
                matricula;


            cabecalho.appendChild(
                nome
            );


            cabecalho.appendChild(
                matriculaDiv
            );


            /*
            GRID
            */

            const grid =
                document.createElement(
                    "div"
                );


            grid.className =
                "grid";


            /*
            6 QR CODES
            */

            for (
                let i = 0;
                i < 6;
                i++
            ) {

                const container =
                    document.createElement(
                        "div"
                    );


                container.className =
                    "qr-container";


                const qr =
                    document.createElement(
                        "div"
                    );


                qr.className =
                    "qr";


                container.appendChild(
                    qr
                );


                grid.appendChild(
                    container
                );


                criarQRCode(
                    qr,
                    matricula
                );

            }


            arte.appendChild(
                cabecalho
            );


            arte.appendChild(
                grid
            );


            document
                .getElementById(
                    "area-geracao"
                )
                .appendChild(
                    arte
                );


            /*
            Aguarda QR codes
            */

            setTimeout(
                () => {

                    resolve(
                        arte
                    );

                },
                400
            );

        }
    );

}



/*
=========================================================
GERAR TODAS
=========================================================
*/


async function gerarTodas() {


    const matriculas =
        Object.keys(dados);


    if (
        matriculas.length === 0
    ) {

        alert(
            "Nenhum colaborador foi encontrado."
        );

        return;

    }


    const status =
        document.getElementById(
            "status"
        );


    status.innerHTML =
        "⏳ Preparando artes...";


    /*
    LIMPA
    */

    document
        .getElementById(
            "area-geracao"
        )
        .innerHTML = "";


    document
        .getElementById(
            "artes"
        )
        .innerHTML = "";


    listaArtes = [];


    /*
    GERA UM POR UM
    */

    for (
        let i = 0;
        i < matriculas.length;
        i++
    ) {

        const matricula =
            matriculas[i];


        const pessoa =
            dados[matricula];


        status.innerHTML =

            `⏳ Gerando ${i + 1} de ${matriculas.length}...`;


        const arte =
            await criarArte(
                matricula,
                pessoa
            );


        listaArtes.push({

            matricula:
                matricula,

            nome:
                pessoa.nome ||
                "Sem nome",

            elemento:
                arte

        });

    }


    status.innerHTML =

        `✅ ${listaArtes.length} arte(s) gerada(s).`;

}



/*
=========================================================
CONVERTER ARTE PARA PNG
=========================================================
*/


async function gerarPNG(
    elemento
) {


    const canvas =
        await html2canvas(
            elemento,

            {

                width:
                    1181,

                height:
                    1772,

                scale:
                    1,

                backgroundColor:
                    "#ffffff",

                useCORS:
                    true,

                logging:
                    false

            }
        );


    return new Promise(
        resolve => {

            canvas.toBlob(
                blob => {

                    resolve(
                        blob
                    );

                },

                "image/png"
            );

        }
    );

}



/*
=========================================================
NOME DO ARQUIVO
=========================================================
*/


function limparNome(
    nome
) {

    return String(nome)

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .replace(
            /[^a-zA-Z0-9\s_-]/g,
            ""
        )

        .replace(
            /\s+/g,
            "_"
        )

        .substring(
            0,
            80
        );

}



/*
=========================================================
BAIXAR ZIP
=========================================================
*/


async function baixarZIP() {


    /*
    Se ainda não gerou,
    gera automaticamente.
    */

    if (
        listaArtes.length === 0
    ) {

        await gerarTodas();

    }


    if (
        listaArtes.length === 0
    ) {

        return;

    }


    const status =
        document.getElementById(
            "status"
        );


    status.innerHTML =
        "📦 Preparando ZIP...";


    const zip =
        new JSZip();


    for (
        let i = 0;
        i < listaArtes.length;
        i++
    ) {

        const item =
            listaArtes[i];


        status.innerHTML =

            `📦 Criando arquivo ${i + 1} de ${listaArtes.length}...`;


        const blob =
            await gerarPNG(
                item.elemento
            );


        const nome =
            limparNome(
                item.nome
            );


        zip.file(

            `${item.matricula}_${nome}.png`,

            blob

        );

    }


    status.innerHTML =
        "📦 Compactando arquivos...";


    const arquivoZIP =
        await zip.generateAsync({

            type:
                "blob",

            compression:
                "DEFLATE",

            compressionOptions:
                {
                    level: 6
                }

        });


    saveAs(

        arquivoZIP,

        "QR_Codes_10x15_Galaxia.zip"

    );


    status.innerHTML =

        `✅ ZIP pronto! ${listaArtes.length} artes geradas.`;

}



/*
=========================================================
INICIAR
=========================================================
*/


carregarDados();


</script>


</body>

</html>
