<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerador de QR Codes | Galáxia Navegação</title>

    <!-- QR CODE -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 30px;

            background: #f2f4f7;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #222;

        }


        .painel {

            max-width: 1200px;

            margin: 0 auto;

            background: #ffffff;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 3px 15px rgba(0,0,0,.10);

        }


        h1 {

            margin: 0 0 10px;

            font-size: 26px;

        }


        .descricao {

            color: #555;

            margin-bottom: 20px;

        }


        .informacoes {

            margin-top: 20px;

            padding: 15px;

            background: #f7f7f7;

            border-radius: 8px;

            line-height: 1.8;

        }


        .botoes-principais {

            display: flex;

            flex-wrap: wrap;

            gap: 12px;

            margin-top: 25px;

        }


        button {

            border: none;

            border-radius: 8px;

            padding: 11px 16px;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

        }


        button:disabled {

            opacity: .5;

            cursor: not-allowed;

        }


        .btn-gerar {

            background: #0066cc;

            color: white;

            padding: 14px 22px;

            font-size: 15px;

        }


        .btn-gerar:hover {

            background: #0052a3;

        }


        .btn-qr {

            background: #198754;

            color: white;

        }


        .btn-arte {

            background: #6f42c1;

            color: white;

        }


        .btn-qr:hover {

            background: #157347;

        }


        .btn-arte:hover {

            background: #59359a;

        }


        #status {

            margin-top: 20px;

            font-weight: bold;

            line-height: 1.6;

        }


        .barra {

            width: 100%;

            height: 14px;

            background: #e5e7eb;

            border-radius: 10px;

            overflow: hidden;

            margin-top: 12px;

            display: none;

        }


        .progresso {

            width: 0%;

            height: 100%;

            background: #0066cc;

            transition: width .2s;

        }


        #busca {

            width: 100%;

            margin-top: 25px;

            padding: 13px 15px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            display: none;

        }


        #lista {

            margin-top: 20px;

        }


        .colaborador {

            display: grid;

            grid-template-columns:
                minmax(220px, 1fr)
                250px
                550px;

            gap: 20px;

            align-items: center;

            padding: 20px 0;

            border-bottom: 1px solid #ddd;

        }


        .dados-colaborador {

            align-self: start;

        }


        .nome {

            font-weight: bold;

            font-size: 16px;

            margin-bottom: 7px;

        }


        .matricula {

            color: #666;

            font-size: 14px;

        }


        .qr-container {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 10px;

        }


        .qr-individual {

            width: 180px;

            height: 180px;

            background: white;

        }


        .qr-individual img {

            width: 180px !important;

            height: 180px !important;

            display: block;

        }


        .arte-container {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 10px;

        }


        .arte {

            width: 300px;

            height: 450px;

            background: white;

            border: 1px solid #ddd;

            position: relative;

            overflow: hidden;

            flex-shrink: 0;

        }


        .arte-nome {

            position: absolute;

            top: 18px;

            left: 8px;

            right: 8px;

            text-align: center;

            font-weight: bold;

            font-family: Arial, Helvetica, sans-serif;

            line-height: 1.05;

            overflow: hidden;

            white-space: nowrap;

        }


        .arte-matricula {

            position: absolute;

            top: 43px;

            left: 8px;

            right: 8px;

            text-align: center;

            font-size: 11px;

            font-family: Arial, Helvetica, sans-serif;

        }


        .qr-arte {

            position: absolute;

            width: 135px;

            height: 135px;

        }


        .qr-arte img {

            width: 135px !important;

            height: 135px !important;

            display: block;

        }


        .qr-1 {

            left: 9px;

            top: 105px;

        }


        .qr-2 {

            left: 156px;

            top: 105px;

        }


        .qr-3 {

            left: 9px;

            top: 246px;

        }


        .qr-4 {

            left: 156px;

            top: 246px;

        }


        .qr-5 {

            left: 9px;

            top: 387px;

        }


        .qr-6 {

            left: 156px;

            top: 387px;

        }


        .mensagem-vazia {

            padding: 30px;

            text-align: center;

            color: #777;

        }


        @media (max-width: 900px) {

            .colaborador {

                grid-template-columns: 1fr;

            }

            .qr-individual {

                width: 220px;

                height: 220px;

            }

            .qr-individual img {

                width: 220px !important;

                height: 220px !important;

            }

        }

    </style>

</head>


<body>


<div class="painel">


    <h1>
        🖨️ Gerador de QR Codes
    </h1>


    <div class="descricao">

        Gere os QR Codes dos tripulantes e as artes prontas para impressão.

    </div>


    <div class="informacoes">

        <div>
            👤 <strong>Fonte dos dados:</strong>
            dados.json
        </div>

        <div>
            🔲 <strong>QR individual:</strong>
            1 QR Code por matrícula
        </div>

        <div>
            🖨️ <strong>Arte:</strong>
            10 × 15 cm com 6 QR Codes
        </div>

        <div>
            📐 <strong>Cada QR da arte:</strong>
            4,5 × 4,5 cm
        </div>

    </div>


    <div
        id="contador"
        style="margin-top:20px;font-weight:bold;">

        Carregando colaboradores...

    </div>


    <div class="botoes-principais">

        <button
            id="btnGerar"
            class="btn-gerar"
            onclick="gerarTodos()">

            🔲 GERAR TODOS OS QR CODES

        </button>

    </div>


    <input
        type="text"
        id="busca"
        placeholder="🔎 Buscar por nome ou matrícula..."
        oninput="filtrarColaboradores()"
    >


    <div id="status"></div>


    <div
        id="barra"
        class="barra">

        <div
            id="progresso"
            class="progresso">
        </div>

    </div>


    <div id="lista"></div>


</div>



<script>


/*
=========================================================
CONFIGURAÇÕES
=========================================================
*/

const DADOS_URL =
    "https://galaxia-qsms.github.io/certificados-tripulantes/dados.json";


const URL_SITE =
    "https://galaxia-qsms.github.io/certificados-tripulantes/?matricula=";


let dados = {};

let colaboradoresGerados = false;


/*
=========================================================
CARREGAR DADOS
=========================================================
*/

async function carregarDados() {

    try {

        const resposta =
            await fetch(
                DADOS_URL +
                "?t=" +
                Date.now()
            );


        if (!resposta.ok) {

            throw new Error(
                "HTTP " +
                resposta.status
            );

        }


        dados =
            await resposta.json();


        if (
            !dados ||
            typeof dados !== "object"
        ) {

            throw new Error(
                "Formato inválido do dados.json."
            );

        }


        const total =
            Object.keys(dados).length;


        document.getElementById(
            "contador"
        ).innerHTML =

            `👥 <strong>${total}</strong> colaborador(es) encontrado(s).`;


    }

    catch (erro) {

        console.error(erro);


        document.getElementById(
            "contador"
        ).innerHTML =

            "❌ Não foi possível carregar o dados.json.";

    }

}


/*
=========================================================
LIMPAR NOME PARA ARQUIVO
=========================================================
*/

function limparNome(nome) {

    return String(nome)

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .replace(
            /[^a-zA-Z0-9\s_-]/g,
            ""
        )

        .trim()

        .replace(
            /\s+/g,
            "_"
        );

}


/*
=========================================================
AJUSTAR TAMANHO DO NOME DA ARTE
=========================================================
*/

function calcularFonteNome(nome) {

    const quantidade =
        nome.length;


    if (quantidade <= 24) {

        return 17;

    }


    if (quantidade <= 32) {

        return 14;

    }


    if (quantidade <= 40) {

        return 12;

    }


    return 10;

}


/*
=========================================================
CRIAR QR
=========================================================
*/

function criarQR(container, matricula, tamanho) {

    return new Promise((resolve, reject) => {

        container.innerHTML = "";


        try {

            new QRCode(
                container,
                {

                    text:
                        URL_SITE +
                        encodeURIComponent(
                            matricula
                        ),

                    width:
                        tamanho,

                    height:
                        tamanho,

                    colorDark:
                        "#000000",

                    colorLight:
                        "#ffffff",

                    correctLevel:
                        QRCode.CorrectLevel.H

                }
            );


        }

        catch (erro) {

            reject(erro);

            return;

        }


        let tentativas = 0;


        function verificar() {

            const img =
                container.querySelector(
                    "img"
                );


            const canvas =
                container.querySelector(
                    "canvas"
                );


            if (
                img ||
                canvas
            ) {

                resolve();

                return;

            }


            tentativas++;


            if (
                tentativas >= 50
            ) {

                reject(
                    new Error(
                        "QR Code não foi criado."
                    )
                );

                return;

            }


            setTimeout(
                verificar,
                30
            );

        }


        verificar();

    });

}


/*
=========================================================
GERAR TODOS
=========================================================
*/

async function gerarTodos() {

    if (
        colaboradoresGerados
    ) {

        document.getElementById(
            "lista"
        ).scrollIntoView({
            behavior: "smooth"
        });

        return;

    }


    const matriculas =
        Object.keys(dados);


    if (
        matriculas.length === 0
    ) {

        alert(
            "Nenhum colaborador encontrado."
        );

        return;

    }


    const botao =
        document.getElementById(
            "btnGerar"
        );


    const status =
        document.getElementById(
            "status"
        );


    const barra =
        document.getElementById(
            "barra"
        );


    const progresso =
        document.getElementById(
            "progresso"
        );


    const lista =
        document.getElementById(
            "lista"
        );


    botao.disabled = true;

    barra.style.display = "block";

    progresso.style.width = "0%";


    lista.innerHTML = "";


    /*
    Cria as linhas primeiro
    */

    matriculas.forEach(
        (matricula, indice) => {

            const pessoa =
                dados[matricula] || {};


            const nome =
                String(
                    pessoa.nome ||
                    "NOME NÃO INFORMADO"
                ).toUpperCase();


            const colaborador =
                document.createElement(
                    "div"
                );


            colaborador.className =
                "colaborador";


            colaborador.dataset.nome =
                nome.toLowerCase();


            colaborador.dataset.matricula =
                String(
                    matricula
                ).toLowerCase();


            /*
            =================================================
            DADOS
            =================================================
            */

            const dadosDiv =
                document.createElement(
                    "div"
                );


            dadosDiv.className =
                "dados-colaborador";


            dadosDiv.innerHTML =

                `<div class="nome">
                    ${nome}
                </div>

                <div class="matricula">
                    MATRÍCULA: ${matricula}
                </div>`;


            /*
            =================================================
            QR INDIVIDUAL
            =================================================
            */

            const qrDiv =
                document.createElement(
                    "div"
                );


            qrDiv.className =
                "qr-container";


            const qr =
                document.createElement(
                    "div"
                );


            qr.className =
                "qr-individual";


            qr.id =
                "qr-" +
                indice;


            const btnQR =
                document.createElement(
                    "button"
                );


            btnQR.className =
                "btn-qr";


            btnQR.disabled = true;


            btnQR.innerHTML =
                "⬇️ BAIXAR QR";


            btnQR.onclick =
                function() {

                    baixarQR(
                        qr,
                        nome,
                        matricula
                    );

                };


            qrDiv.appendChild(
                qr
            );


            qrDiv.appendChild(
                btnQR
            );


            /*
            =================================================
            ARTE 6 QR
            =================================================
            */

            const arteDiv =
                document.createElement(
                    "div"
                );


            arteDiv.className =
                "arte-container";


            const arte =
                document.createElement(
                    "div"
                );


            arte.className =
                "arte";


            arte.id =
                "arte-" +
                indice;


            /*
            Nome
            */

            const arteNome =
                document.createElement(
                    "div"
                );


            arteNome.className =
                "arte-nome";


            arteNome.style.fontSize =
                calcularFonteNome(
                    nome
                ) + "px";


            arteNome.textContent =
                nome;


            /*
            Matrícula
            */

            const arteMatricula =
                document.createElement(
                    "div"
                );


            arteMatricula.className =
                "arte-matricula";


            arteMatricula.textContent =
                "MATRÍCULA: " +
                matricula;


            arte.appendChild(
                arteNome
            );


            arte.appendChild(
                arteMatricula
            );


            /*
            6 QR Codes
            */

            const classesQR = [
                "qr-1",
                "qr-2",
                "qr-3",
                "qr-4",
                "qr-5",
                "qr-6"
            ];


            const qrArte = [];


            classesQR.forEach(
                classe => {

                    const q =
                        document.createElement(
                            "div"
                        );


                    q.className =
                        "qr-arte " +
                        classe;


                    arte.appendChild(
                        q
                    );


                    qrArte.push(
                        q
                    );

                }
            );


            const btnArte =
                document.createElement(
                    "button"
                );


            btnArte.className =
                "btn-arte";


            btnArte.disabled =
                true;


            btnArte.innerHTML =
                "⬇️ BAIXAR ARTE 10×15";


            btnArte.onclick =
                function() {

                    baixarArte(
                        arte,
                        nome,
                        matricula
                    );

                };


            arteDiv.appendChild(
                arte
            );


            arteDiv.appendChild(
                btnArte
            );


            /*
            =================================================
            MONTA LINHA
            =================================================
            */

            colaborador.appendChild(
                dadosDiv
            );


            colaborador.appendChild(
                qrDiv
            );


            colaborador.appendChild(
                arteDiv
            );


            lista.appendChild(
                colaborador
            );


            /*
            Guarda referências
            */

            colaborador._qr =
                qr;

            colaborador._qrArte =
                qrArte;

            colaborador._btnQR =
                btnQR;

            colaborador._btnArte =
                btnArte;

        }
    );


    /*
    =====================================================
    GERA OS QR CODES
    =====================================================
    */

    for (
        let i = 0;
        i < matriculas.length;
        i++
    ) {

        const matricula =
            matriculas[i];


        const pessoa =
            dados[matricula] || {};


        const nome =
            String(
                pessoa.nome ||
                "Nome não informado"
            ).toUpperCase();


        const percentual =
            Math.round(
                (
                    i /
                    matriculas.length
                ) * 100
            );


        progresso.style.width =
            percentual + "%";


        status.innerHTML =

            `⏳ Gerando ${i + 1} de ${matriculas.length} — ${nome}`;


        const colaborador =
            lista.children[i];


        try {

            /*
            QR individual
            */

            await criarQR(
                colaborador._qr,
                matricula,
                180
            );


            /*
            QR da arte
            */

            for (
                let q = 0;
                q < 6;
                q++
            ) {

                await criarQR(
                    colaborador._qrArte[q],
                    matricula,
                    135
                );

            }


            /*
            Habilita os botões
            */

            colaborador._btnQR.disabled =
                false;


            colaborador._btnArte.disabled =
                false;

        }

        catch (erro) {

            console.error(
                "Erro:",
                matricula,
                erro
            );

        }


        /*
        Dá um pequeno respiro
        */

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    5
                )
        );

    }


    progresso.style.width =
        "100%";


    status.innerHTML =

        `✅ Todos os QR Codes foram gerados!<br>
         👥 ${matriculas.length} colaborador(es).`;


    document.getElementById(
        "busca"
    ).style.display =
        "block";


    colaboradoresGerados =
        true;


    botao.disabled =
        false;


    botao.innerHTML =
        "🔲 QR CODES JÁ GERADOS";


}


/*
=========================================================
BAIXAR QR INDIVIDUAL
=========================================================
*/

function baixarQR(
    container,
    nome,
    matricula
) {

    const canvas =
        container.querySelector(
            "canvas"
        );


    const img =
        container.querySelector(
            "img"
        );


    let link =
        document.createElement(
            "a"
        );


    link.download =
        "QR_" +
        limparNome(nome) +
        "_" +
        matricula +
        ".png";


    if (canvas) {

        link.href =
            canvas.toDataURL(
                "image/png"
            );

    }

    else if (img) {

        /*
        Cria um canvas para transformar
        a imagem em PNG baixável.
        */

        const temp =
            document.createElement(
                "canvas"
            );


        temp.width =
            img.naturalWidth ||
            512;


        temp.height =
            img.naturalHeight ||
            512;


        const ctx =
            temp.getContext(
                "2d"
            );


        ctx.drawImage(
            img,
            0,
            0
        );


        link.href =
            temp.toDataURL(
                "image/png"
            );

    }

    else {

        alert(
            "QR Code ainda não foi gerado."
        );

        return;

    }


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );

}


/*
=========================================================
BAIXAR ARTE
=========================================================
*/

async function baixarArte(
    elemento,
    nome,
    matricula
) {

    /*
    Aqui usamos SVG/Canvas manualmente
    para gerar uma imagem PNG de
    10 x 15 cm em alta resolução.
    */


    const largura =
        1000;


    const altura =
        1500;


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        largura;


    canvas.height =
        altura;


    const ctx =
        canvas.getContext(
            "2d"
        );


    /*
    Fundo branco
    */

    ctx.fillStyle =
        "#ffffff";


    ctx.fillRect(
        0,
        0,
        largura,
        altura
    );


    /*
    Nome
    */

    const nomeLimpo =
        String(
            nome
        ).toUpperCase();


    let tamanhoFonte =
        55;


    if (
        nomeLimpo.length > 32
    ) {

        tamanhoFonte =
            45;

    }


    if (
        nomeLimpo.length > 40
    ) {

        tamanhoFonte =
            38;

    }


    ctx.fillStyle =
        "#000000";


    ctx.font =
        `bold ${tamanhoFonte}px Arial`;


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillText(
        nomeLimpo,
        500,
        45
    );


    /*
    Matrícula
    */

    ctx.font =
        "28px Arial";


    ctx.fillText(
        "MATRÍCULA: " + matricula,
        500,
        80
    );


    /*
    =====================================================
    PEGAR O QR DO PRIMEIRO QR DA ARTE
    =====================================================
    */

    const primeiroQR =
        elemento.querySelector(
            ".qr-1"
        );


    const img =
        primeiroQR.querySelector(
            "img"
        );


    const qrCanvas =
        primeiroQR.querySelector(
            "canvas"
        );


    let qrFonte = null;


    if (img) {

        qrFonte =
            img;

    }

    else if (qrCanvas) {

        qrFonte =
            qrCanvas;

    }


    if (!qrFonte) {

        alert(
            "QR Code ainda não foi gerado."
        );

        return;

    }


    /*
    =====================================================
    POSIÇÕES
    =====================================================
    */

    const posicoes = [

        [30, 350],

        [520, 350],

        [30, 820],

        [520, 820],

        [30, 1290],

        [520, 1290]

    ];


    /*
    QR = 450 × 450 px
    equivalente a 4,5 × 4,5 cm
    na arte de 10 × 15 cm.
    */

    posicoes.forEach(
        posicao => {

            ctx.drawImage(
                qrFonte,
                posicao[0],
                posicao[1],
                450,
                450
            );

        }
    );


    /*
    =====================================================
    DOWNLOAD
    =====================================================
    */

    const link =
        document.createElement(
            "a"
        );


    link.download =
        "ARTE_QR_" +
        limparNome(nome) +
        "_" +
        matricula +
        ".png";


    link.href =
        canvas.toDataURL(
            "image/png"
        );


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );

}


/*
=========================================================
FILTRO
=========================================================
*/

function filtrarColaboradores() {

    const termo =
        document.getElementById(
            "busca"
        ).value
        .toLowerCase()
        .trim();


    const colaboradores =
        document.querySelectorAll(
            ".colaborador"
        );


    colaboradores.forEach(
        colaborador => {

            const nome =
                colaborador.dataset.nome;


            const matricula =
                colaborador.dataset.matricula;


            if (
                nome.includes(termo) ||
                matricula.includes(termo)
            ) {

                colaborador.style.display =
                    "grid";

            }

            else {

                colaborador.style.display =
                    "none";

            }

        }
    );

}


/*
=========================================================
INICIAR
=========================================================
*/

carregarDados();

</script>


</body>

</html>
