<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Impressão de QR Codes | Galáxia Navegação</title>

    <!-- QR CODE -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .container {
            max-width: 1400px;
            margin: auto;
        }

        h1 {
            margin: 0 0 8px;
            color: #12395b;
            font-size: 28px;
        }

        .subtitulo {
            color: #64748b;
            margin-bottom: 25px;
        }

        .topo {
            background: white;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .acoes {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .btn-gerar {
            background: #12395b;
            color: white;
        }

        .btn-gerar:hover {
            background: #0d2d49;
        }

        .contador {
            font-size: 14px;
            color: #64748b;
        }

        .busca {
            width: 100%;
            margin-top: 18px;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .busca:focus {
            border-color: #12395b;
        }

        #lista {
            display: none;
        }

        .pessoa {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .pessoa-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e5e7eb;
        }

        .nome {
            font-size: 18px;
            font-weight: bold;
            color: #12395b;
        }

        .matricula {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
        }

        .opcoes {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            align-items: flex-start;
        }

        .opcao {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .opcao-titulo {
            font-size: 13px;
            font-weight: bold;
            color: #475569;
        }

        /* ============================
           QR INDIVIDUAL
        ============================ */

        .qr-individual-box {
            width: 180px;
            height: 180px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }

        .qr-individual {
            width: 160px;
            height: 160px;
        }

        .btn-qr {
            background: #2563eb;
            color: white;
            width: 180px;
        }

        .btn-qr:hover {
            background: #1d4ed8;
        }


        /* ============================
           ARTE 10 x 15 CM
           
           Visualização:
           300 x 450 px
           
           QR:
           135 x 135 px
           = 4,5 x 4,5 cm
           
           Posições:
           X = 15 / 150
           Y = 45 / 180 / 315
           
           Assim os seis QR cabem
           exatamente dentro da arte.
        ============================ */

        .arte-wrapper {
            width: 300px;
            height: 450px;
            background: white;
            border: 1px solid #cbd5e1;
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .arte-nome {
            position: absolute;
            top: 7px;
            left: 10px;
            right: 10px;

            height: 17px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 11px;
            font-weight: bold;
            color: #111827;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .arte-matricula {
            position: absolute;
            top: 24px;
            left: 10px;
            right: 10px;

            height: 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 8px;
            color: #4b5563;
        }

        .qr-arte {
            position: absolute;
            width: 135px;
            height: 135px;
        }

        .qr1 {
            left: 15px;
            top: 45px;
        }

        .qr2 {
            left: 150px;
            top: 45px;
        }

        .qr3 {
            left: 15px;
            top: 180px;
        }

        .qr4 {
            left: 150px;
            top: 180px;
        }

        .qr5 {
            left: 15px;
            top: 315px;
        }

        .qr6 {
            left: 150px;
            top: 315px;
        }

        .btn-arte {
            background: #059669;
            color: white;
            width: 300px;
        }

        .btn-arte:hover {
            background: #047857;
        }

        .vazio {
            padding: 40px;
            text-align: center;
            color: #64748b;
            background: white;
            border-radius: 12px;
        }

        .status {
            margin-top: 15px;
            font-size: 13px;
            color: #64748b;
        }

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .pessoa-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .opcoes {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <div class="topo">

        <h1>Impressão de QR Codes</h1>

        <div class="subtitulo">
            Gere os QR Codes dos tripulantes e escolha individualmente o que deseja baixar.
        </div>

        <div class="acoes">

            <button
                class="btn-gerar"
                onclick="gerarTodos()">
                🔲 GERAR TODOS OS QR CODES
            </button>

            <span
                class="contador"
                id="contador">
                Nenhum QR Code gerado.
            </span>

        </div>

        <input
            type="text"
            id="busca"
            class="busca"
            placeholder="🔎 Buscar por nome ou matrícula..."
            oninput="filtrar()">

        <div
            class="status"
            id="status">
        </div>

    </div>


    <div id="lista"></div>

</div>


<script>

    let dados = {};
    let pessoas = [];


    /* ==========================================
       CARREGAR DADOS
    ========================================== */

    async function carregarDados() {

        try {

            const resposta = await fetch(
                "dados.json?t=" + Date.now()
            );

            if (!resposta.ok) {
                throw new Error("Não foi possível carregar o dados.json");
            }

            dados = await resposta.json();

            pessoas = Object.keys(dados)
                .map(matricula => {

                    return {

                        matricula: matricula,

                        nome: dados[matricula].nome || "",

                        certificados:
                            dados[matricula].certificados || []

                    };

                })
                .sort((a, b) =>
                    a.nome.localeCompare(
                        b.nome,
                        "pt-BR"
                    )
                );

            document.getElementById("contador").innerText =
                pessoas.length +
                " pessoas encontradas.";

        }

        catch (erro) {

            console.error(erro);

            document.getElementById("status").innerText =
                "❌ Erro ao carregar os dados.";

        }

    }


    /* ==========================================
       GERAR TODOS
    ========================================== */

    function gerarTodos() {

        if (!pessoas.length) {

            alert(
                "Nenhuma pessoa encontrada no dados.json."
            );

            return;

        }

        const lista =
            document.getElementById("lista");

        lista.innerHTML = "";

        pessoas.forEach((pessoa, index) => {

            const card =
                criarPessoa(pessoa, index);

            lista.appendChild(card);

        });

        lista.style.display = "block";

        document.getElementById("status").innerText =
            "✅ QR Codes gerados. Escolha o arquivo que deseja baixar.";

    }


    /* ==========================================
       CRIAR CARD
    ========================================== */

    function criarPessoa(pessoa, index) {

        const card =
            document.createElement("div");

        card.className = "pessoa";

        card.dataset.nome =
            pessoa.nome.toLowerCase();

        card.dataset.matricula =
            pessoa.matricula.toLowerCase();


        const header =
            document.createElement("div");

        header.className =
            "pessoa-header";


        const identificacao =
            document.createElement("div");


        const nome =
            document.createElement("div");

        nome.className = "nome";

        nome.innerText =
            pessoa.nome || "SEM NOME";


        const matricula =
            document.createElement("div");

        matricula.className =
            "matricula";

        matricula.innerText =
            "Matrícula: " + pessoa.matricula;


        identificacao.appendChild(nome);

        identificacao.appendChild(matricula);


        header.appendChild(identificacao);


        const opcoes =
            document.createElement("div");

        opcoes.className =
            "opcoes";


        /* ======================================
           OPÇÃO 1 — QR INDIVIDUAL
        ====================================== */

        const opcaoQR =
            document.createElement("div");

        opcaoQR.className =
            "opcao";


        const tituloQR =
            document.createElement("div");

        tituloQR.className =
            "opcao-titulo";

        tituloQR.innerText =
            "QR CODE INDIVIDUAL";


        const qrBox =
            document.createElement("div");

        qrBox.className =
            "qr-individual-box";


        const qrDiv =
            document.createElement("div");

        qrDiv.className =
            "qr-individual";

        qrDiv.id =
            "qr-" + index;


        qrBox.appendChild(qrDiv);


        const botaoQR =
            document.createElement("button");

        botaoQR.className =
            "btn-qr";

        botaoQR.innerText =
            "⬇️ BAIXAR QR";


        botaoQR.onclick = function() {

            baixarQR(
                qrDiv,
                pessoa
            );

        };


        opcaoQR.appendChild(tituloQR);

        opcaoQR.appendChild(qrBox);

        opcaoQR.appendChild(botaoQR);


        /* ======================================
           OPÇÃO 2 — ARTE 6 QR
        ====================================== */

        const opcaoArte =
            document.createElement("div");

        opcaoArte.className =
            "opcao";


        const tituloArte =
            document.createElement("div");

        tituloArte.className =
            "opcao-titulo";

        tituloArte.innerText =
            "ARTE — 10 × 15 CM";


        const arte =
            document.createElement("div");

        arte.className =
            "arte-wrapper";

        arte.id =
            "arte-" + index;


        const arteNome =
            document.createElement("div");

        arteNome.className =
            "arte-nome";

        arteNome.innerText =
            pessoa.nome || "SEM NOME";


        const arteMatricula =
            document.createElement("div");

        arteMatricula.className =
            "arte-matricula";

        arteMatricula.innerText =
            "Matrícula: " + pessoa.matricula;


        arte.appendChild(arteNome);

        arte.appendChild(arteMatricula);


        /* QR 1 */

        const qrArte1 =
            criarQRArte(
                pessoa,
                "qr-arte-" + index + "-1",
                "qr-arte qr1"
            );


        /* QR 2 */

        const qrArte2 =
            criarQRArte(
                pessoa,
                "qr-arte-" + index + "-2",
                "qr-arte qr2"
            );


        /* QR 3 */

        const qrArte3 =
            criarQRArte(
                pessoa,
                "qr-arte-" + index + "-3",
                "qr-arte qr3"
            );


        /* QR 4 */

        const qrArte4 =
            criarQRArte(
                pessoa,
                "qr-arte-" + index + "-4",
                "qr-arte qr4"
            );


        /* QR 5 */

        const qrArte5 =
            criarQRArte(
                pessoa,
                "qr-arte-" + index + "-5",
                "qr-arte qr5"
            );


        /* QR 6 */

        const qrArte6 =
            criarQRArte(
                pessoa,
                "qr-arte-" + index + "-6",
                "qr-arte qr6"
            );


        arte.appendChild(qrArte1);

        arte.appendChild(qrArte2);

        arte.appendChild(qrArte3);

        arte.appendChild(qrArte4);

        arte.appendChild(qrArte5);

        arte.appendChild(qrArte6);


        const botaoArte =
            document.createElement("button");

        botaoArte.className =
            "btn-arte";

        botaoArte.innerText =
            "⬇️ BAIXAR ARTE 10×15";


        botaoArte.onclick = function() {

            baixarArte(
                pessoa,
                index
            );

        };


        opcaoArte.appendChild(tituloArte);

        opcaoArte.appendChild(arte);

        opcaoArte.appendChild(botaoArte);


        opcoes.appendChild(opcaoQR);

        opcoes.appendChild(opcaoArte);


        card.appendChild(header);

        card.appendChild(opcoes);


        /* ======================================
           GERAR QR INDIVIDUAL
        ====================================== */

        setTimeout(() => {

            gerarQR(
                qrDiv,
                pessoa
            );

        }, 20);


        return card;

    }


    /* ==========================================
       CRIAR QR ARTE
    ========================================== */

    function criarQRArte(
        pessoa,
        id,
        classe
    ) {

        const div =
            document.createElement("div");

        div.id = id;

        div.className = classe;

        gerarQR(
            div,
            pessoa
        );

        return div;

    }


    /* ==========================================
       GERAR QR
    ========================================== */

    function gerarQR(
        elemento,
        pessoa
    ) {

        elemento.innerHTML = "";

        const url =
            "https://galaxia-qsms.github.io/certificados-tripulantes/?matricula=" +
            encodeURIComponent(
                pessoa.matricula
            );


        new QRCode(
            elemento,
            {

                text: url,

                width: 135,

                height: 135,

                correctLevel:
                    QRCode.CorrectLevel.H

            }
        );

    }


    /* ==========================================
       BAIXAR QR INDIVIDUAL
    ========================================== */

    function baixarQR(
        elemento,
        pessoa
    ) {

        const canvas =
            elemento.querySelector("canvas");

        const img =
            elemento.querySelector("img");


        if (canvas) {

            baixarCanvas(
                canvas,
                "QR_" +
                limparNome(pessoa.nome) +
                "_" +
                pessoa.matricula +
                ".png"
            );

            return;

        }


        if (img) {

            const canvasNovo =
                document.createElement("canvas");

            canvasNovo.width = 135;

            canvasNovo.height = 135;

            const ctx =
                canvasNovo.getContext("2d");


            img.onload = function() {

                ctx.drawImage(
                    img,
                    0,
                    0,
                    135,
                    135
                );

                baixarCanvas(
                    canvasNovo,
                    "QR_" +
                    limparNome(pessoa.nome) +
                    "_" +
                    pessoa.matricula +
                    ".png"
                );

            };


            if (img.complete) {

                ctx.drawImage(
                    img,
                    0,
                    0,
                    135,
                    135
                );

                baixarCanvas(
                    canvasNovo,
                    "QR_" +
                    limparNome(pessoa.nome) +
                    "_" +
                    pessoa.matricula +
                    ".png"
                );

            }

        }

    }


    /* ==========================================
       BAIXAR ARTE 10 × 15 CM
       
       1000 × 1500 px

       QR = 450 × 450 px
       45 × 45 mm

       X:
       50
       500

       Y:
       150
       600
       1050

       Último QR:
       1050 + 450 = 1500
       
       Portanto não corta.
    ========================================== */

    async function baixarArte(
        pessoa,
        index
    ) {

        const canvas =
            document.createElement("canvas");

        canvas.width = 1000;

        canvas.height = 1500;


        const ctx =
            canvas.getContext("2d");


        /* FUNDO */

        ctx.fillStyle =
            "#ffffff";

        ctx.fillRect(
            0,
            0,
            1000,
            1500
        );


        /* ======================================
           NOME
        ====================================== */

        ctx.fillStyle =
            "#111827";

        ctx.font =
            "bold 32px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";


        let nome =
            pessoa.nome || "SEM NOME";


        /*
           Evita que nomes muito grandes
           estourem a largura.
        */

        if (nome.length > 42) {

            nome =
                nome.substring(
                    0,
                    42
                ) + "...";

        }


        ctx.fillText(
            nome,
            500,
            35
        );


        /* ======================================
           MATRÍCULA
        ====================================== */

        ctx.fillStyle =
            "#4b5563";

        ctx.font =
            "20px Arial";


        ctx.fillText(
            "Matrícula: " +
            pessoa.matricula,
            500,
            78
        );


        /* ======================================
           QR CODES
        ====================================== */

        const qrSize = 450;


        const posicoes = [

            {
                x: 50,
                y: 150
            },

            {
                x: 500,
                y: 150
            },

            {
                x: 50,
                y: 600
            },

            {
                x: 500,
                y: 600
            },

            {
                x: 50,
                y: 1050
            },

            {
                x: 500,
                y: 1050
            }

        ];


        const qrOriginal =
            document.getElementById(
                "qr-arte-" +
                index +
                "-1"
            );


        if (!qrOriginal) {

            alert(
                "Não foi possível localizar o QR Code."
            );

            return;

        }


        const qrCanvas =
            qrOriginal.querySelector(
                "canvas"
            );

        const qrImg =
            qrOriginal.querySelector(
                "img"
            );


        if (qrCanvas) {

            posicoes.forEach(
                pos => {

                    ctx.drawImage(
                        qrCanvas,
                        pos.x,
                        pos.y,
                        qrSize,
                        qrSize
                    );

                }
            );

        }

        else if (qrImg) {

            await desenharImagem(
                ctx,
                qrImg,
                posicoes,
                qrSize
            );

        }

        else {

            alert(
                "QR Code ainda não foi carregado. Tente novamente."
            );

            return;

        }


        /* ======================================
           DOWNLOAD
        ====================================== */

        const nomeArquivo =
            "ARTE_" +
            limparNome(pessoa.nome) +
            "_" +
            pessoa.matricula +
            ".png";


        baixarCanvas(
            canvas,
            nomeArquivo
        );

    }


    /* ==========================================
       DESENHAR IMAGEM
    ========================================== */

    function desenharImagem(
        ctx,
        img,
        posicoes,
        tamanho
    ) {

        return new Promise(
            resolve => {

                function desenhar() {

                    posicoes.forEach(
                        pos => {

                            ctx.drawImage(
                                img,
                                pos.x,
                                pos.y,
                                tamanho,
                                tamanho
                            );

                        }
                    );

                    resolve();

                }


                if (img.complete) {

                    desenhar();

                }

                else {

                    img.onload =
                        desenhar;

                }

            }
        );

    }


    /* ==========================================
       DOWNLOAD CANVAS
    ========================================== */

    function baixarCanvas(
        canvas,
        nomeArquivo
    ) {

        const link =
            document.createElement("a");

        link.download =
            nomeArquivo;

        link.href =
            canvas.toDataURL(
                "image/png"
            );

        document.body.appendChild(
            link
        );

        link.click();

        document.body.removeChild(
            link
        );

    }


    /* ==========================================
       LIMPAR NOME PARA ARQUIVO
    ========================================== */

    function limparNome(
        nome
    ) {

        return (
            nome
                .normalize("NFD")
                .replace(
                    /[\u0300-\u036f]/g,
                    ""
                )
                .replace(
                    /[^a-zA-Z0-9]/g,
                    "_"
                )
        );

    }


    /* ==========================================
       FILTRO
    ========================================== */

    function filtrar() {

        const termo =
            document
                .getElementById("busca")
                .value
                .toLowerCase()
                .trim();


        const cards =
            document.querySelectorAll(
                ".pessoa"
            );


        cards.forEach(
            card => {

                const nome =
                    card.dataset.nome;

                const matricula =
                    card.dataset.matricula;


                if (
                    nome.includes(termo) ||
                    matricula.includes(termo)
                ) {

                    card.style.display =
                        "";

                }

                else {

                    card.style.display =
                        "none";

                }

            }
        );

    }


    /* ==========================================
       INICIAR
    ========================================== */

    carregarDados();

</script>

</body>

</html>
